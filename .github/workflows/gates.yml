name: gates

# Runs on GitHub-hosted runners by default. To run on the local containerized
# runner instead, set the repository VARIABLE  GATES_RUNNER=self-hosted
# (see runner/README.md). Delete the variable to fall back — jobs on a powered-
# off machine otherwise queue until it returns.
#
# Postgres is provided two ways because the local runner deliberately has no
# Docker inside it (no docker.sock — see runner/docker-compose.yml):
#   hosted      → started here as a throwaway container
#   self-hosted → the compose sidecar, injected as DATABASE_URL by the runner

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ${{ vars.GATES_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Start Postgres (hosted runners only)
        if: runner.environment == 'github-hosted'
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=opsmind_test \
            postgres:16
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres && break
            sleep 2
          done

      - name: Resolve database URL
        run: |
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/opsmind_test" >> "$GITHUB_ENV"
          else
            echo "DATABASE_URL=${DATABASE_URL}" >> "$GITHUB_ENV"   # from the compose sidecar
          fi

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci

      # Prisma 5 exits 1 on a schema with no models, and phase 0 deliberately
      # has none — the kernel entities arrive with kernel-schema-base. Skip both
      # steps until a model exists rather than blocking the scaffold on a client
      # there is nothing to generate. From the first model onwards this runs and
      # fails exactly as before; it is a bootstrap guard, not a relaxation.
      - name: Prisma client and migrations
        run: |
          # A missing schema must not read as "no models". That would skip
          # migrate deploy silently and run the tests against an unmigrated
          # database with a green check — the one failure direction that hides.
          # Both layouts are matched so moving to prisma/schema/*.prisma later
          # cannot disable generation by deleting schema.prisma.
          schemas=$(ls prisma/schema.prisma prisma/schema/*.prisma 2>/dev/null || true)
          if [ -z "$schemas" ]; then
            echo "::error::no .prisma schema found under prisma/ — refusing to skip generate and migrate deploy"
            exit 1
          fi
          # POSIX classes, not \s and \w: those are GNU extensions and this also
          # runs on the self-hosted runner.
          if grep -qhE '^[[:space:]]*model[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]*\{' $schemas; then
            npx prisma generate
            npx prisma migrate deploy
          else
            echo "no models declared yet — skipping generate/deploy (phase 0)"
          fi
      - name: Legacy Prisma client for the differential oracle
        # Built from reference/legacy/prisma/schema.prisma, separate from this
        # build's client. Unconditional, unlike the generate above: the legacy
        # schema always has models, and vitest.config.ts throws rather than
        # falling back to the shared client if this is missing.
        run: node prisma/generate-legacy-client.mjs

      # scripts/test-guards.sh used to run here as a step of its own. It is now
      # the first line of gate.sh's full suite, so it is not repeated: two
      # invocations mean two places to keep in sync, and the one that mattered
      # was the one the developer never ran. A guard suite that only CI runs is
      # a guard suite found broken after the pull request is open — which is
      # exactly how it was found broken.
      - name: Run all gates
        run: GATE_BASE=origin/${{ github.base_ref || 'main' }} ./scripts/gate.sh
      - run: npm run build
