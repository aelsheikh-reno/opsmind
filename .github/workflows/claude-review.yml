name: claude-review

# Autonomous review on every pull request. This is the second reviewer: the
# `reviewer` subagent runs locally before the PR exists, this one sees the
# final diff in the repository's full context.
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1
        with:
          # Authenticates with your Claude subscription. Generate once with
          # `claude setup-token` locally, save as the CLAUDE_CODE_OAUTH_TOKEN
          # repository secret. To use API billing instead, replace this line
          # with: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model claude-opus-4-8 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
          prompt: |
            Review this pull request against CLAUDE.md and docs/architecture/.

            Fail the review for any of:
            - a module touching another module's tables
            - a database import outside repository.ts
            - a page or route handler holding domain logic
            - floating point arithmetic on currency
            - an amount without a currency or a movement without a direction
            - date arithmetic ignoring the business calendar
            - a boolean recording payment state
            - a test weakened, skipped or deleted
            - money or date logic with no test
            - an eslint-disable or ts-ignore added

            Post inline comments on the exact lines. Do not summarise the diff
            back — the author can read it. Only flag real problems, and say
            which rule each one breaks. If there is nothing, say so in one line.
