      - "reportRun with an empty alert list means checked-and-clear, and resolves by absence within the scopes declared complete"
      - "A source that misses its schedule raises source-dark; its alerts go STALE and are never resolved by absence"
      - "Fingerprint is deterministic from tenant:app:source:entity:policy — no source keeps memory"
      - "Severity is monotonic while an alert is open; a downgrade resolves and reopens"
      - "acknowledge pauses paging without closing; a lapsed resolve window re-escalates"
      - "suppress is a fourth state with a window; the alert stays open and reappears"
      - "The service never judges severity — it consumes what the source reports"
