# FULL PRODUCT GRAPH v2 — append these nodes to tasks/backlog.yaml
#
# Audited 2026-08-15 against the repo backlog (44 nodes, SHA 174d7ca) and the
# architecture pages. v2 changes: presentation-onboarding added (a whole zone
# had no node); email-webhook entrance and per-channel thresholds added to
# ingestion; shapes-* dependencies wired; every service owning tables writes
# its field-level cards into data-model.md in its own PR (the rate-terms
# pattern); ops-scheduling no longer waits on adapters; domain screens wait on
# their modules; ops-observability retagged product; parity resolves the five
# unbuilt legacy routes; cutover requires all four zones.
#
# Everything the architecture specifies and no node produced. Append only:
# change no existing node, no status, no waiver.
#
# kind: product | infrastructure   — drives /next selection policy
#
# Phases:
#   1  kernel            (in progress)
#   2  money spine       (in progress)
#   3  core modules
#   4  capability services
#   5  integration adapters
#   6  presentation
#   7  cutover
#
# Every node carries kind: product unless it builds pipeline machinery.

# ── phase 3 · core modules not yet covered ──────────────────────────────

- id: module-ingestion-pipeline
  title: Document ingestion — classify, extract, validate
  phase: 3
  kind: product
  depends_on: [kernel-registry-fx, service-parser, shapes-ingestion]
  spec: docs/architecture/components-core-ingestion.md
  also_read:
    - docs/architecture/flows-ingestion.md
    - docs/architecture/walkthrough.md
  legacy_reference: reference/legacy/lib/ingest.ts
  produces:
    - lib/modules/ingestion/
    - prisma/schema.prisma
    - prisma/migrations/
    - tests/modules/ingestion/
  done_when:
    gates: [lint, types, boundaries, tests, coverage]
    assertions:
      - "All four channels — upload, email webhook, WhatsApp, Drive — converge on one pipeline"
      - "The email entrance verifies the provider's webhook signature and an allowed-sender list before anything is read"
      - "Confidence thresholds are per channel and stricter for unattended ones (email, WhatsApp, Drive), where nobody corrects a bad extraction inline"
      - "The field schema is read from the registry and passed to the parser on every call"
      - "Confidence below the type's threshold creates a work item and commits nothing"
      - "An unclassifiable document is queued, never guessed"
  risk: compliance
  status: todo

