    - tests/modules/ingestion/
  done_when:
    gates: [lint, types, boundaries, tests, coverage]
    assertions:
      - "A rule is data — trigger, ANDed conditions, ordered actions from a fixed vocabulary"
      - "An administrator can add a rule without a deployment"
      - "Local actions commit in one transaction; the two crossing a process boundary handle failure explicitly"
      - "A failed condition stops execution and creates a work item naming the condition"
  risk: compliance
  status: todo

