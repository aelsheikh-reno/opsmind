      - "The 30 fixture tests pass byte-for-byte unchanged"
      - "Every consumer test file passes unchanged"
      - "The public contract is preserved name for name"
  risk: low
  status: done
  note: >
    The reader was hand-rolled: a 187-line character scanner, a seven-state mode
    machine, brace and template depth bookkeeping, a regex-versus-division
    heuristic and six regexes. typescript was already a devDependency the whole
    time — it is what the types gate runs. Raised on kernel-entities-law, whose
    waiver rested on justifying the reader; done before
    kernel-entities-parties makes it load-bearing for six components rather
    than one.

    The tests were the equivalence proof and they were not touched: 30 fixtures
    and four consumer files, all unchanged, 487 passing.

    It closed real holes rather than only saving lines. A db.<table> chain
    broken across lines was invisible to the line-based scanner, so the // owns:
    cross-check — the guard on rule 1 — could pass on a repository touching an
    undeclared table purely because of formatting. Declarations written inside
    STRING LITERALS were reported as real: the mutant fixtures in
    kernel-regime-data.test.ts were read as genuine exports of VAT_RATE = 0.05
    and vatDeadlineDays = 28. Signatures were silently truncated at a brace in a
    return type, and a type alias swallowed the declaration that followed it.

- id: reader-public-surface-precision
  title: publicDeclarations over-reports a module's public surface
  phase: 0
  depends_on: [kernel-source-compiler-api]
  spec: PIPELINE.md#the-gates
  produces:
    - tests/kernel/kernel-source.ts
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "A module's surface is what its index.ts actually exports, named or starred"
      - "A function the repository exports but index.ts does not name is not on the surface"
  risk: low
  status: todo
  note: >
    RECORDED, NOT BUILT. It does not let incorrect data ship and does not let a
    red gate merge, so under the stopping rule it waits behind product work.

    publicDeclarations follows `from "./repository"` and takes the target file
    whole, so it cannot tell `export { a }` from `export *`: it reports every
    exported function in the repository whether index.ts names it or not. Found
    on kernel-entities-parties, where a test built on it stayed green after both
    enrolment functions were removed from the export block — the surface had
    lost the API and the sweep could not see it.

    That test now reads the export list directly, so nothing depends on the
    over-reporting today. Every FUTURE test built on publicDeclarations inherits
    the blind spot silently, which is why this is written down rather than left
    in a review thread.
- id: gate-service-boundary-rules
  title: A capability service's repository is a repository, and its index is its surface
  phase: 0
  depends_on: [gate-eslint-ignores-generated-output]
  spec: PIPELINE.md#the-gates
  also_read:
    - docs/architecture/data-ownership.md          # one writing owner per table
    - docs/architecture/architecture-containers.md # ADR-021's in-process shape
  produces:
    - eslint.config.mjs
    - templates/eslint.config.mjs
    - scripts/check-boundaries.sh
    - tests/scaffold/eslint-boundaries.test.ts
    - tasks/backlog.yaml
    - tests/baseline.json
  done_when:
    gates: [lint, types, boundaries, tests]
    assertions:
      - "lib/services/<service>/repository.ts is the one file in that service permitted to reach the database, and every other file in it is refused"
      - "A service repository with no '// owns:' declaration fails the boundary check, in the same words a module repository does"
      - "A service repository touching a table it does not declare is reported by name"
      - "An import of lib/services/<service>/ past its index.ts fails, as it already does for a module"
      - "eslint.config.mjs and templates/eslint.config.mjs still carry identical boundary blocks"
      - "No module or kernel repository changes verdict"
  risk: low
  status: todo
  note: >
    Nothing under lib/services/ has ever existed, so the enforcement layer has
    never been asked about it, and it currently answers wrongly in two
    directions at once.

    eslint block 2 names lib/db.ts, lib/modules/*/repository.ts,
    lib/kernel/*/repository.ts and prisma/** — so the FIRST service repository
    fails lint for importing the database it is the designated importer of. And
    check-boundaries.sh reads the '// owns:' declaration only for modules and
    kernel, while its "nothing outside a repository may reach the database"
    grep excludes every path ending repository.ts by name. So the obvious fix —
    widening the eslint block alone — produces a file that may import the
    client and is checked by nothing. That is worse than the red lint it
    replaces, because it is silent.

    CLAUDE.md rule 4 is unenforced for services too: the deep-import pattern
    names @/lib/modules only, and ADR-021's whole claim is that the seam is the
    same call whether a capability is a folder or a container. A seam anyone can
    reach around is not a seam, and the risk ADR-021 names to police is exactly
    interface bypass inside the monolith.

    Done before there is a service to argue about, so the rule is not written to
    suit the first file that needs it. Roughly 50 implementation lines, nearly
    all of it two glob lists and one loop bound.
- id: shapes-alert-manager
