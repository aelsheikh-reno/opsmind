# The task graph. Each node is one pull request.
#
# risk:  low        — mechanical; gates alone are sufficient
#        money      — touches currency; requires a differential test
#        compliance — touches a deadline, filing or permission; requires a
#                     differential test and is never auto-merged
#
# status: todo | in_progress | blocked | done

- id: scaffold-project
  title: Scaffold the new OpsMind project
  phase: 0
  depends_on: []
  spec: SETUP.md
  produces:
    - package.json
    - tsconfig.json
    - eslint.config.mjs
    - vitest.config.ts
    - prisma/schema.prisma
    - lib/kernel/.gitkeep
    - lib/modules/.gitkeep
    - lib/services/.gitkeep
    - lib/adapters/.gitkeep
  done_when:
    gates: [lint, types]
    assertions:
      - "npm test runs vitest; npm run lint runs eslint"
      - "eslint.config.mjs contains the three boundary rule blocks from templates/"
      - "Next.js 16, React 19, TypeScript strict, Prisma, vitest + coverage installed"
      - "@vitest/coverage-v8 present so the coverage gate can run"
  risk: low
  status: done
  note: >
    Nothing else can run before this exists. Copy the lint boundary rules from
    templates/eslint.config.mjs verbatim — they are the enforcement layer.

# The harness was built as one node and came in at ~1660 lines against the 800
# line size budget — 352 of implementation and 1117 of tests, which is the ratio
# CLAUDE.md's testing policy asks for on the only oracle in the repository.
# Rather than waive the budget on the first task that would ever cite the
# precedent, it is split into three. The last node keeps the id
# `harness-differential` so kernel-schema-base's dependency stays valid; it is
# now satisfied transitively.

- id: harness-vitest-legacy-alias
  title: Keep the legacy oracle from resolving into the new build
  phase: 0
  depends_on: [scaffold-project]
  spec: PIPELINE.md#the-problem-this-design-solves
  produces:
    - vitest.config.ts
    - tests/config/legacy-alias.test.ts
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "A legacy module's `@/...` import resolves inside reference/legacy/, never into the new build"
      - "The new build's own `@` alias still resolves to the repository root"
      - "Coverage measures this build's code, not the legacy oracle it loads"
  risk: low
  status: done
  note: >
    reference/legacy/lib/fx.ts opens with `import { prisma } from "@/lib/prisma"`
    and the vitest alias points "@" at the NEW repo root, so a legacy module
    loaded by the harness would bind to the code under test and the differential
    test would compare the candidate against itself. Latent only until this build
    grows a lib/prisma — fix it before any module lands, not after.

- id: harness-diff-fields
  title: Field-by-field diff with a classified cause
  phase: 0
  depends_on: [harness-vitest-legacy-alias]
  spec: PIPELINE.md#the-problem-this-design-solves
  produces:
    - tests/differential/diff-fields.ts
    - tests/differential/diff-fields.test.ts
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "Recurses objects and arrays, reporting every differing leaf with a dot/bracket path"
      - "Each difference carries a specific cause and a concrete detail naming the values"
      - "Tolerance is an integer count of minor units, so the rounding boundary is exact"
      - "A value it cannot compare structurally is reported, never silently called equal"
  risk: low
  status: done
  note: >
    Tolerance is expressed in minor units (fils, piastres) as an integer, not a
    decimal fraction: comparing `Math.abs(b - a) <= 0.01` classifies four
    identical one-fils differences two different ways depending on binary
    representation. Ahmed's decision, 2026-08-13.

- id: harness-differential
  title: Differential runner against the legacy system
  phase: 0
  depends_on: [harness-diff-fields]
  spec: PIPELINE.md#the-problem-this-design-solves
  produces:
    - tests/differential/harness.ts
    - tests/golden/README.md
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "Runs the same input through legacy and new code and diffs field by field"
      - "One case failing or throwing never stops the run or hides the others"
      - "A legacy module that cannot load fails loudly — never a stub, never an empty module"
      - "Golden dataset is anonymised — no real salary, passport or Emirates ID"
  risk: low
  status: done
  note: >
    Build this before any module. It is the only oracle for business
    correctness, and every money task depends on it.

- id: harness-sub-minor-cause
  title: Give a sub-minor-unit gap its own cause
  phase: 0
  depends_on: [harness-differential]
  spec: PIPELINE.md#the-problem-this-design-solves
  produces:
    - tests/differential/diff-fields.ts
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "A gap finer than minorUnitScale reports a cause distinct from rounding"
      - "No consumer can filter it away as tolerated noise"
  risk: money
  status: done
  note: >
    diffFields reports a gap finer than the scale as `rounding` with a gap of
    zero. Kuwait and Bahrain use three-decimal currencies, so at the default
    minorUnitScale of 100 a genuine one-fils KWD or BHD discrepancy lands there.
    Nothing is lost today — the difference is reported, both raw values sit on
    the record, and matched is strict — but the two are conflated, and a
    consumer that treats `rounding` as tolerated noise would drop a real gap.
    Deferred deliberately rather than reopening a merged, reviewed PR.

- id: harness-exact-minor-scaling
  phase: 0
  title: Scale to minor units exactly, so the classification matches the rule
  depends_on: [harness-sub-minor-cause]
  spec: PIPELINE.md#the-problem-this-design-solves
  produces:
    - tests/differential/diff-fields.ts
    - tests/differential/diff-fields.test.ts
    - tests/differential/harness.ts        # comments only — they described the old mechanism
    - tests/differential/harness.test.ts   # ditto, plus cases for the corrected classification
    - tests/golden/README.md               # ditto — it described the old mechanism
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "Two values less than one minor unit apart report sub-minor-unit, whether or not they round to the same integer"
      - "Two values exactly one minor unit apart never report sub-minor-unit, at any magnitude a payslip reaches"
      - "The gap in minor units is the true gap — no pair is inflated or collapsed by the scaling"
      - "No float arithmetic decides a classification"
  risk: money
  status: done
  note: >
    Resolves the predicate question harness-sub-minor-cause escalated. Ahmed's
    decision, 2026-08-14: the implementation follows the assertion already
    approved on that node — a gap finer than minorUnitScale is what the cause
    keys on — rather than the "both sides round to the same integer" proxy that
    was actually built.

    The proxy and the rule come apart because `Math.round(x * scale)` is a
    float multiply. 0.135 and 0.145 are exactly one minor unit apart yet
    collapse to a gap of 0, while 0.145 and 0.155 inflate to a gap of 2;
    11.25% of x.xx5 pairs misreport in one direction or the other. The
    inflation half is a pre-existing bug in the rounding / value-mismatch
    boundary, not only in the new cause, so this fixes both.

    A magnitude test does not work either: 0.145 - 0.135 is 0.009999999999999981
    in binary, so `|b - a| * scale < 1` calls an exactly-one-unit pair
    sub-minor. Scale exactly instead — shift the decimal point on each value's
    round-trip string and compare as integers — which is what
    harness-diff-fields promised with "no float in the decision" and did not
    deliver.

- id: gate-size-impl-scope
  title: Count the guard harness as tests, not as implementation
  phase: 0
  depends_on: [scaffold-project]
  spec: PIPELINE.md#the-gates
  produces:
    - scripts/gate.sh
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "scripts/test-guards.sh is excluded from size-impl and still counted in size-total"
      - "Nothing else moves out of the implementation measurement"
      - "The 400 and 800 budgets are unchanged"
  risk: low
  status: done
  note: >
    size-impl excludes tests/ by path, so scripts/test-guards.sh — a harness
    whose only job is verifying the guards — is measured as implementation.
    gate.sh's own comment says tests are kept out of that budget because
    otherwise thorough tests compete with implementation and the cheapest way
    to pass is to write fewer of them. That is exactly what happens here: the
    gate-size-waiver task measured 413 impl lines against 400, 276 of them
    probes. This corrects where the line is drawn, not where the budget sits.

- id: gate-size-waiver
  title: Let a task record a reasoned size-total waiver on its node
  phase: 0
  depends_on: [gate-size-impl-scope]
  spec: PIPELINE.md#the-gates
  produces:
    - scripts/gate.sh
    - scripts/test-guards.sh
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "size_total on a backlog node raises that task's total budget and nothing else's"
      - "The waiver is read from the committed backlog, never from the uncommitted .task-current.yaml"
      - "A task with no size_total keeps the 800 default, and size-impl's 400 is never overridable"
      - "An active waiver is printed with its value and its reason — it is never silent"
  risk: low
  status: done
  note: >
    staging-deploy came in at 308 implementation lines against its 400 budget
    and 1578 total against 800 — 1270 of that a single test file, of which ~450
    is parsing machinery any split would have to carry into both halves. The
    800 backstop is the wrong shape for a config task, where proving a property
    about a Dockerfile costs more lines than the Dockerfile. Ahmed's decision,
    2026-08-13: make the waiver data on the task, reviewable in the diff,
    rather than raise the budget for everyone or weaken the gate.

- id: staging-deploy
  title: Staging deployment to the Proxmox VM
  phase: 0
  depends_on: [gate-size-waiver]
  spec: runner/PROXMOX.md
  size_total: 1800
  size_waiver_reason: >
    1270 of the 1578 lines are tests/deploy/staging-deploy.test.ts, which must
    parse a Dockerfile, a compose file and a workflow to prove anything at all;
    ~450 lines of that is shared parsing machinery. Implementation is 308
    against the unchanged 400 budget.
  produces:
    - Dockerfile
    - docker-compose.staging.yml
    - .github/workflows/deploy-staging.yml
  done_when:
    gates: [lint, types]
    assertions:
      - "Compose runs app + postgres + nginx; app image builds from the Dockerfile"
      - "deploy-staging.yml triggers on push to main and runs ONLY on a runner labeled staging"
      - "prisma migrate deploy runs on every deploy before the app starts"
      - "No secret appears in the compose file or the workflow — all via an env file on the VM"
  risk: low
  status: done
  note: >
    This is what makes the parallel build visible: every merge lands on the
    lab staging VM where the team can try it while the old system still runs.

- id: kernel-schema-base
  title: Prisma schema for the kernel entities — calendar, law, parties, document
  phase: 1
  depends_on: [harness-differential, gate-migrations-committable]
  size_total: 1700
  size_waiver_reason: >
    Roughly 1640 lines total, of which ~1145 are tests/kernel/: they parse the
    schema so the four assertions are enforceable rather than aspirational,
    which is the ratio CLAUDE.md's testing policy asks for on a
    compliance-tagged task. Implementation is ~310 against the unchanged 400 —
    schema, the backlog graph and the migration lock. Generated migration DDL
    is out of size-impl per ADR-028 and still counted in this total.

    Figures are approximate on purpose: this reason is itself part of the diff
    it describes, so any exact count it states is wrong as soon as it is
    written. An earlier version of this node claimed 369 when the real figure
    was 450 — measured before later edits and never rechecked — which is how a
    waiver stops being reviewable.
  spec: docs/architecture/data-model.md
  also_read:
    - docs/architecture/components-kernel.md   # what each entity is for
    - docs/architecture/data-vocabulary.md     # commitment / open item / settlement
    - docs/architecture/decisions.md           # ADR-014, ADR-015, ADR-017, ADR-025
  legacy_reference: reference/legacy/prisma/schema.prisma
  produces:
    - prisma/schema.prisma
    - prisma/migrations/
    - tests/kernel/
  done_when:
    gates: [lint, types, boundaries, tests]
    differential: none   # a schema computes nothing; risk still blocks auto-merge
    assertions:
      - "Document carries a direction and it is not nullable"
      - "No isPaid or equivalent boolean exists anywhere in the schema"
      - "JurisdictionEnrolment is unique on (legalEntityId, regimeId)"
      - "Jurisdiction carries a business calendar with a weekend mask"
  risk: compliance
  status: done
  note: >
    Unblocked 2026-08-14: the architecture specification is committed. The spec
    pointer names data-model.md, which carries the field-level shapes, rather
    than components-kernel.md, which says what each entity is for — both are
    listed, read the model for structure and the component page for intent.

    Split 2026-08-14. The full kernel measured 677 implementation lines against
    the 400 that cannot be waived — 364 of schema and 310 of generated
    migration DDL, and stripping every comment only reached 563. This node
    keeps its id so module-deadlines' dependency stays valid, and keeps all
    four assertions unchanged: Jurisdiction, BusinessCalendar, BusinessHoliday,
    Regime, LegalEntity, JurisdictionEnrolment and Document. See the waiver
    reason above for the measured size — no figure is repeated here, because
    the one that used to be was stale.
    People, accounts and the registry move to kernel-schema-people-registry.
    Depends on gate-migrations-committable because until that landed the
    migration could not be committed at all and the size gate under-read this
    task by 310 lines.

- id: module-deadlines
  title: Deadline monitor — the reference module
  phase: 1
  depends_on: [kernel-schema-base]
  size_total: 1200
  size_waiver_reason: >
    Roughly 1005 lines: ~580 tests, ~126 prisma (90 schema, 36 generated DDL),
    ~159 lib, ~59 backlog, ~46 documentation, ~35 the four enforcement layers
    lib/db.ts needed. Implementation is ~335 against the unchanged 400 — the
    generated DDL and the documentation are out of size-impl by ADR-028 and
    ADR-026 and still counted in this total, which is the point of the split.
    Figures are approximate because this reason is inside the diff it measures;
    they were recomputed from the gate's own pathspecs, not estimated.
    The tests carry the date rules this whole node exists to pin — Gulf week,
    missing-calendar error, calendar-day due dates — at the rigour CLAUDE.md
    asks for on a compliance task, including cases driven against the legacy
    oracle rather than hand-written.
  spec: docs/architecture/components-core-deadline-monitor.md
  legacy_reference: reference/legacy/app/api/cron/expiry-reminders/route.ts
  produces:
    - prisma/schema.prisma
    - prisma/migrations/
    - docs/architecture/data-model.md
    - docs/architecture/data-ownership.md
    - lib/db.ts
    - lib/modules/deadlines/{index,calendar}.ts
    - tests/modules/deadlines/
    - tests/kernel/db-client.test.ts
    - scripts/{guard-write,check-boundaries,test-guards}.sh
    - eslint.config.mjs
    - templates/eslint.config.mjs
    - docs/architecture/{components-core-deadline-monitor,open-items}.md
  done_when:
    gates: [lint, types, boundaries, tests, coverage, differential]
    assertions:
      - "Business-day arithmetic uses the Sunday-Thursday Gulf week"
      - "A jurisdiction with no BusinessCalendar is an error, never a Saturday-Sunday fallback"
      - "The statutory due date is periodEnd + Regime.deadlineDays in calendar days, and the date to file by rolls forward off a weekend or holiday"
      - "Repositories import the shared client from lib/db.ts and never construct one"
  risk: compliance
  status: done
  note: >
    Built first among modules because it is small and exercises every pattern
    the other six copy: module interface, repository boundary, business
    calendar, and the alert contract.

    Unblocked 2026-08-14 with kernel-schema-base: its own spec and the
    data-ownership.md the boundary rule cites are both committed now.

    Split 2026-08-14 on size. The whole module measured 544 implementation lines
    against the non-overridable 400, of which lib/ was 227 code and 177 comment
    — and those comments carry the calendar-days rule and the port rationale,
    which ADR-028 names as the wrong thing to delete for a number. This node
    keeps the two tables, the business calendar, the date rules and lib/db.ts.
    Threshold severity, registration, the nightly sweep, the store port and the
    alert contract move to module-deadlines-sweep, which declares its own node
    in its own PR. Its code and tests are written and carried, not deleted.

    thresholds.ts moved on review. The first cut of this split left it here
    while its tests went with the sweep, so it shipped at 0% covered with four
    business rules nothing in the spec states — the split cut the code at one
    seam and the tests at another. Those four are now settled and written into
    components-core-deadline-monitor.md, so the sweep node builds to a spec
    rather than to a note: severity is the MAXIMUM across breached windows and
    never the tightest, a threshold is inclusive at its bound, an overdue
    deadline takes the highest configured severity, and a type with no
    threshold row raises one misconfiguration alert per type per run instead of
    silently never reporting.

    What that node must still settle. The sweep is scheduled 02:00 with no
    timezone stated anywhere, and in the Gulf that is 22:00 the previous UTC
    day, so a UTC default warns a day late — Ahmed 2026-08-14: the
    jurisdiction's civil date defines today, and no schema field carries one
    yet. Two conventions the written tests pin that no page states: business-day
    ruling: business-day distance counts (from, to]. The missing-calendar
    question is settled — see the sweep node.md takes the entire source dark for one bad jurisdiction.

    The threshold semantics are no longer on that list — severity as the maximum
    across breached windows, inclusive bounds, overdue at the highest band, and
    an unconfigured type raising rather than staying silent are all settled and
    written into components-core-deadline-monitor.md. The civil-date convention
    and the accepted legacy difference behind 2024-04-27 are in data-model.md.

    DeadlineRegistration and ThresholdTable had no field-level spec — one cell
    in data-ownership.md was their only mention anywhere. Ahmed approved
    deriving them from what the spec does fix, and the shape is now written into
    data-model.md so they stop being undocumented.

- id: gate-size-docs-exclusion
  title: Keep documentation out of the implementation budget
  phase: 0
  depends_on: [scaffold-project]
  spec: PIPELINE.md#the-gates
  produces:
    - scripts/gate.sh
    - docs/architecture/decisions.md
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "size-impl excludes docs/**, **/*.md, tests/** and scripts/test-guards.sh"
      - "size-total still counts documentation, and stays waivable per task via size_total"
      - "The 400 impl budget and the 800 total default are unchanged"
      - "The assumption that markdown carries no executable content is recorded at the exclusion"
  risk: low
  status: done
  note: >
    CLAUDE.md requires a behaviour change and its documentation in the same PR,
    and the reviewer fails a PR that lets the docs drift. Charging prose to the
    code budget therefore penalises every task that correctly updates its spec,
    and makes not updating the docs the cheapest way to pass — the same perverse
    incentive gate-size-impl-scope removed for the guard harness, aimed at the
    one artifact the reviewer is told to check. Surfaced when the architecture
    specification measured 1992 markdown lines against the non-overridable 400.
    Recorded as ADR-026.
- id: kernel-entities-law
  title: Kernel entities — Jurisdiction, its calendar, Regime and Enrolment
  phase: 1
  depends_on: [kernel-schema-people-registry]
  size_total: 2600
  size_waiver_reason: >
    960 of ~2100 test lines are tests/kernel/kernel-source.ts and its fixtures,
    the reader the // owns: assertion depends on — a claim about source
    structure no runtime test can make. Implementation is ~400 against the
    unchanged 400, and this reason counts itself. Review judged the waiver
    larger than the work justifies, because the reader is hand-rolled and
    typescript is already a devDependency; granted once, on the condition that
    replacing it is settled before kernel-entities-parties reuses it. The full
    argument is in the PR.
  spec: docs/architecture/components-kernel.md
  also_read:
    - docs/architecture/data-model.md
  legacy_reference: reference/legacy/prisma/schema.prisma
  produces:
    - lib/kernel/{jurisdiction,regime,enrolment}/{index,repository}.ts
    - tests/kernel/
  done_when:
    gates: [lint, types, boundaries, tests, coverage]
    assertions:
      - "Jurisdiction exposes a business calendar with weekend mask and holidays"
      - "Regime holds rates, brackets and deadline days as data, not constants"
      - "Every kernel repository declares its tables with // owns:"
  risk: low
  status: done
  note: >
    The first half of kernel-entities, split on size. The six components
    measured 728 implementation lines against a budget that cannot be waived,
    and stripping every comment and every blank line from all twelve files
    leaves 397 — three under the limit. So the trade ADR-026 and ADR-028 make
    available elsewhere is not available here: there is nothing to buy, the
    surface is simply larger than one node.

    The seam is the one prisma/schema.prisma already draws and
    components-kernel.md already orders: the law and the calendar, then the
    parties. This half imports nothing from the other. Each assertion lands
    wholly inside one node rather than being divided — which is what made this
    split acceptable where the kernel schema's was not.

