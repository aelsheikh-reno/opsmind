    - tests/modules/deadlines/
    - tests/baseline.json
  done_when:
    gates: [lint, types, boundaries, tests, coverage]
    assertions:
      - "Severity is the maximum across breached windows, never the tightest one"
      - "A threshold is inclusive at its bound — exactly seven business days remaining breaches a seven-day window"
      - "An overdue deadline, with negative days remaining, reports the highest configured severity"
      - "A deadline type with no ThresholdTable row is reported as unconfigured, never scored as safe"
      - "A fingerprint is deterministic and carries no severity, so an escalation does not change identity"
  risk: compliance
  status: done
  note: >
    The second of the three nodes module-deadlines-sweep was split into when its
    implementation measured 532 lines against the unwaivable 400 (Ahmed's
    decision, 2026-08-15). This one carries the four settled threshold semantics;
    module-deadlines-civil-date carries the timezone field and the civil-date
    convention; module-deadlines-sweep keeps its id and carries scoped
    completeness, STALE, the misconfiguration alerts, statelessness,
    evaluate-on-register and the `// owns:` declaration.

    Nothing here is a constant. The windows and severities arrive as
    ThresholdTable rows, editable in Settings without a deployment, exactly as a
    SOC tunes detection rules (ADR-020). This node owns the predicate; RAISING an
    alert about an unconfigured type is the sweep's job and lands there.

    The four semantics are written into components-core-deadline-monitor.md and
    were settled by Ahmed on 2026-08-14, so this node builds to a spec rather
    than to the legacy oracle — legacy has no threshold table at all.

    THE CARRIED severity.test.ts DOES NOT LAND HERE. It imports `sweep` from the
    shared surface and pins these rules THROUGH a run, so it cannot live where
    the sweep does not exist; it moves to module-deadlines-sweep with the other
    three sweep-level files. This node is tested directly, against the exported
    functions — the same split civil-date.test.ts forced on the first node.

- id: deadlines-fingerprint-and-severity-result
  title: A fingerprint segment cannot collide, and a verdict cannot be conflated
  phase: 1
  depends_on: [module-deadlines-thresholds]
  spec: docs/architecture/components-core-deadline-monitor.md
  also_read:
    - docs/architecture/flows-alerting.md          # the fingerprint's segments
  produces:
    - lib/modules/deadlines/{thresholds,index}.ts
    - tests/modules/deadlines/thresholds.test.ts
    - tasks/backlog.yaml
    - tests/baseline.json
  done_when:
    gates: [lint, types, boundaries, tests, coverage, differential]
    assertions:
      - "Two deadlines differing only by a colon inside a segment produce distinct fingerprints"
      - "A segment containing no colon fingerprints byte for byte as it did before, so no open alert changes identity"
      - "severityFor distinguishes not-breached from not-configured in its type, so a caller cannot conflate them"
      - "Nothing that thresholds.test.ts pinned before is loosened by the new shape"
  risk: compliance
  status: todo
  note: >
    Both findings came out of review on module-deadlines-thresholds and were
    carried rather than fixed. They land here, ahead of module-deadlines-sweep,
    because the sweep's index.ts already consumes the discriminated result —
    landing these second would mean writing the sweep against the old shape and
    then changing it again (Ahmed, 2026-08-16).

    THE COLON COLLISION. fingerprintFor joins its segments with ":", so
    ("reno","document","123:expiry","renewal") and
    ("reno","document","123","expiry:renewal") produce the same string. Two
    alerts collapse into one and the second is invisible — silently deduped,
    which is the failure mode the fingerprint exists to prevent.

    Escaped rather than rejected at registerDeadline: jurisdiction ids and policy
    names are fingerprinted too, by both misconfiguration alerts, so a check on
    one caller leaves every other caller colliding. A segment containing neither
    the separator nor the escape is returned byte for byte, so no existing alert
    identity moves — a fingerprint is a stable identity and changing one
    resolves-then-reopens the alert it names.

    THE CONFLATED NULL. severityFor returned null for both "not breached" and
    "not configured", so a caller writing `if (severityFor(...) === null) return;`
    silently drops an unwatched type — spec:46's exact failure, and one the type
    system was not being asked to prevent. It now returns
    {status:"breached", severity} | {status:"safe"} | {status:"unconfigured"},
    so the compiler enforces the distinction rather than the caller remembering
    to also call isConfigured. isConfigured stays: the sweep's per-type pre-pass
    has to run for jurisdictions that have no calendar at all.

- id: module-deadlines-sweep
  title: Deadline monitor — registration, the nightly sweep and the alert contract
  phase: 1
  depends_on: [module-deadlines-civil-date, module-deadlines-thresholds, deadlines-fingerprint-and-severity-result]
  spec: docs/architecture/components-core-deadline-monitor.md
  size_total: 2500
  size_waiver_reason: >
    All four sweep-level test files — civil-date, severity, monitor and scope —
    drive a sweep and cannot land anywhere else; the two sibling nodes were
    tested directly against exported functions for exactly that reason.
    Implementation measured 375 against the unchanged 400. Same shape as every
    waiver ADR-029 catalogued: tests, never implementation. Ahmed, 2026-08-16.
  also_read:
    - docs/architecture/flows-alerting.md          # scoped completeness, resolve-by-absence
    - docs/architecture/operations-scheduling.md   # the 02:00 sweep
  legacy_reference: reference/legacy/app/api/cron/expiry-reminders/route.ts
  produces:
    - lib/modules/deadlines/{index,calendar}.ts
    - tests/modules/deadlines/
    - docs/architecture/flows-alerting.md
    - tasks/backlog.yaml
    - tests/baseline.json
  done_when:
    gates: [lint, types, boundaries, tests, coverage, differential]
    assertions:
      - "A run reports the complete breach set, and an empty set is meaningful"
      - "Registering a deadline already inside a threshold evaluates immediately"
      - "A jurisdiction with no BusinessCalendar errors for THAT jurisdiction only; the run continues"
      - "Completeness is reported per jurisdiction; absence resolves only inside a scope declared complete"
      - "An incomplete jurisdiction's alerts stay open, are marked STALE, and are never resolved by absence"
      - "A missing calendar raises one misconfiguration alert"
      - "The sweep scores against the jurisdiction's civil date, not UTC"
      - "A run is stateless: two runs on the same day report identically, and a missed night self-heals"
      - "Severity is the maximum across breached windows, never the tightest"
      - "A deadline type with no threshold row raises one misconfiguration alert per run, not silence"
      - "Business-day distance is (from, to]: due today is 0, due on the next working day is 1"
  risk: compliance
  status: todo
  note: >
    The second half of module-deadlines. Its implementation and tests are
    already written — repository.ts, the full index.ts, thresholds.ts,
    monitor.test.ts and the sweep half of surface.ts — and were carried out of
    that PR rather than deleted.

    THE WRITTEN TESTS CONTRADICT A SETTLED DECISION AND MUST BE CHANGED WITH
    THE BEHAVIOUR, NOT AROUND IT. They pin "a missing calendar aborts the whole
    run". Ahmed settled the opposite on 2026-08-14: the jurisdiction errors,
    the run continues, healthy jurisdictions resolve by absence normally, the
    broken one's alerts stay open and STALE and are never resolved by absence,
    and one misconfiguration alert is raised. Aborting takes every jurisdiction
    dark for one bad calendar, which is a larger failure than the one it
    avoids. flows-alerting.md now states that completeness is scoped; both
    paths need tests.

    "A jurisdiction with no BusinessCalendar is an error, never a
    Saturday-Sunday fallback" still holds — erroring for that jurisdiction is
    not the same as aborting the run, and the fallback is what rule 9 forbids.

    Timezone. The sweep is scheduled 02:00 with no timezone stated anywhere; in
    the Gulf that is 22:00 the previous UTC day, so a UTC default warns a day
    late. Ahmed 2026-08-14: the jurisdiction's civil date defines today, and the
    timezone lives on BusinessCalendar beside the weekend mask and holidays —
    Jurisdiction is identity, BusinessCalendar is the civil-time rules. No
    schema field carries one yet, so this node adds it.

    Threshold semantics are settled and written into
    components-core-deadline-monitor.md; thresholds.ts moves here with the
    tests that pin them.

    repository.ts AND ITS ASSERTION LEFT THIS NODE (Ahmed, 2026-08-17). Its four
    Prisma calls are not unit-coverable — no PostgreSQL is reachable outside CI —
    so they held diff-cov at 89.09% against the 90 floor, six lines short. They
    land with kernel-repository-integration-tests, where the only tests that can
    exercise them live. The sweep neither caused that nor could fix it, and every
    other module's repository hits it identically.

    TWO THINGS WERE REFUSED HERE, and are recorded so they are not re-proposed.
    A diff-cov waiver: that gate deliberately has no waiver mechanism, because it
    measures what a task is answerable for, and opening a waiver surface on it to
    pass the node that needed one is how a gate stops meaning anything. And a
    CI-only integration test: green in CI and red locally is worse than either
    verdict alone, because a developer learns to ignore the local run — the
    stale-baseline failure again.


