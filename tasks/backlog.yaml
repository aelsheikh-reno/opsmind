# The task graph. Each node is one pull request.
#
# risk:  low        — mechanical; gates alone are sufficient
#        money      — touches currency; requires a differential test
#        compliance — touches a deadline, filing or permission; requires a
#                     differential test and is never auto-merged
#
# status: todo | in_progress | blocked | done

- id: scaffold-project
  title: Scaffold the new OpsMind project
  phase: 0
  depends_on: []
  spec: SETUP.md
  produces:
    - package.json
    - tsconfig.json
    - eslint.config.mjs
    - vitest.config.ts
    - prisma/schema.prisma
    - lib/kernel/.gitkeep
    - lib/modules/.gitkeep
    - lib/services/.gitkeep
    - lib/adapters/.gitkeep
  done_when:
    gates: [lint, types]
    assertions:
      - "npm test runs vitest; npm run lint runs eslint"
      - "eslint.config.mjs contains the three boundary rule blocks from templates/"
      - "Next.js 16, React 19, TypeScript strict, Prisma, vitest + coverage installed"
      - "@vitest/coverage-v8 present so the coverage gate can run"
  risk: low
  status: todo
  note: >
    Nothing else can run before this exists. Copy the lint boundary rules from
    templates/eslint.config.mjs verbatim — they are the enforcement layer.

- id: harness-differential
  title: Differential test harness against the legacy system
  phase: 0
  depends_on: [scaffold-project]
  spec: PIPELINE.md#the-problem-this-design-solves
  produces:
    - tests/differential/harness.ts
    - tests/golden/README.md
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "Runs the same input through legacy and new code and diffs field by field"
      - "Reports a difference with its cause, not just that one exists"
      - "Golden dataset is anonymised — no real salary, passport or Emirates ID"
  risk: low
  status: todo
  note: >
    Build this before any module. It is the only oracle for business
    correctness, and every money task depends on it.

- id: staging-deploy
  title: Staging deployment to the Proxmox VM
  phase: 0
  depends_on: [scaffold-project]
  spec: runner/PROXMOX.md
  produces:
    - Dockerfile
    - docker-compose.staging.yml
    - .github/workflows/deploy-staging.yml
  done_when:
    gates: [lint, types]
    assertions:
      - "Compose runs app + postgres + nginx; app image builds from the Dockerfile"
      - "deploy-staging.yml triggers on push to main and runs ONLY on a runner labeled staging"
      - "prisma migrate deploy runs on every deploy before the app starts"
      - "No secret appears in the compose file or the workflow — all via an env file on the VM"
  risk: low
  status: todo
  note: >
    This is what makes the parallel build visible: every merge lands on the
    lab staging VM where the team can try it while the old system still runs.

- id: kernel-schema-base
  title: Prisma schema for the kernel entities
  phase: 1
  depends_on: [harness-differential]
  spec: docs/architecture/data-model.md
  also_read:
    - docs/architecture/components-kernel.md   # what each entity is for
    - docs/architecture/data-vocabulary.md     # commitment / open item / settlement
    - docs/architecture/decisions.md           # ADR-014, ADR-015, ADR-017, ADR-025
  legacy_reference: reference/legacy/prisma/schema.prisma
  produces:
    - prisma/schema.prisma
    - prisma/migrations/
  done_when:
    gates: [lint, types, boundaries]
    differential: none   # a schema computes nothing; risk still blocks auto-merge
    assertions:
      - "Document carries a direction and it is not nullable"
      - "No isPaid or equivalent boolean exists anywhere in the schema"
      - "JurisdictionEnrolment is unique on (legalEntityId, regimeId)"
      - "Jurisdiction carries a business calendar with a weekend mask"
  risk: compliance
  status: todo

- id: module-deadlines
  title: Deadline monitor — the reference module
  phase: 1
  depends_on: [kernel-schema-base]
  spec: docs/architecture/components-core-deadline-monitor.md
  legacy_reference: reference/legacy/app/api/cron/expiry-reminders/route.ts
  produces:
    - lib/modules/deadlines/{index,repository,thresholds,calendar}.ts
    - tests/modules/deadlines/
  done_when:
    gates: [lint, types, boundaries, tests, coverage, differential]
    assertions:
      - "Business-day arithmetic uses the Sunday-Thursday Gulf week"
      - "A run reports the complete breach set, and an empty set is meaningful"
      - "Thresholds are data in settings, not constants in code"
      - "Registering a deadline already inside a threshold evaluates immediately"
  risk: compliance
  status: todo
  note: >
    Built first among modules because it is small and exercises every pattern
    the other six copy: module interface, repository boundary, business
    calendar, and the alert contract.

- id: kernel-entities
  title: Kernel entities — Person, Document, LegalEntity, Jurisdiction, Regime, Enrolment
  phase: 1
  depends_on: [kernel-schema-base]
  spec: docs/architecture/components-kernel.md
  also_read:
    - docs/architecture/data-model.md          # field-level shapes
  legacy_reference: reference/legacy/prisma/schema.prisma
  produces:
    - lib/kernel/*/{index,repository}.ts
    - tests/kernel/
  done_when:
    gates: [lint, types, boundaries, tests, coverage]
    assertions:
      - "Person carries managerId and supports per-jurisdiction enrolments"
      - "Jurisdiction exposes a business calendar with weekend mask and holidays"
      - "Regime holds rates, brackets and deadline days as data, not constants"
      - "Every kernel repository declares its tables with // owns:"
  risk: low
  status: todo

- id: kernel-registry-fx
  title: Document Type Registry, FX store, Audit log
  phase: 1
  depends_on: [kernel-entities]
  spec: docs/architecture/components-kernel.md
  legacy_reference: reference/legacy/lib/doc-types.ts
  produces:
    - lib/kernel/registry/
    - lib/kernel/fx/
    - lib/kernel/audit/
    - tests/kernel/
  done_when:
    gates: [lint, types, boundaries, tests, coverage, differential]
    assertions:
      - "Document types carry field schema, retention policy and ingestion rules as data"
      - "FX rates live in their own table with an asOf date; snapshots are never recomputed"
      - "Audit entries are append-only; erasure redacts rather than deletes"
  risk: money
  status: todo

- id: money-spine
  title: Commitment, open item and settlement
  phase: 2
  depends_on: [kernel-registry-fx]
  spec: docs/architecture/data-vocabulary.md
  legacy_reference: reference/legacy/lib/wallet.ts
  produces:
    - lib/modules/finance/
    - tests/modules/finance/
  done_when:
    gates: [lint, types, boundaries, tests, coverage, differential]
    assertions:
      - "An open item balance is derived from settlements, never stored"
      - "A converted commitment leaves the forecast so nothing is double counted"
      - "Partial settlements are supported and carry an fx snapshot and recordedBy"
      - "No isPaid boolean exists anywhere"
  risk: money
  status: todo

- id: module-payroll
  title: Payroll — effective-dated terms, statutory deductions, prorata
  phase: 3
  depends_on: [money-spine, module-deadlines]
  spec: docs/architecture/components-core-payroll.md
  legacy_reference: reference/legacy/lib/{prorata,tax}.ts
  produces:
    - lib/modules/payroll/
    - tests/modules/payroll/
  done_when:
    gates: [lint, types, boundaries, tests, coverage, differential]
    assertions:
      - "Salary terms are effective-dated rows; a raise never rewrites a paid period"
      - "Egyptian brackets and UAE gratuity come from Regime data, not code"
      - "Prorata handles a mid-month joiner and leaver in the same period"
      - "Monthly generation is idempotent"
  risk: money
  status: todo

- id: module-projects
  title: Projects — structure, timesheets, milestones
  phase: 3
  depends_on: [kernel-entities]
  spec: docs/architecture/components-core-projects.md
  produces:
    - lib/modules/projects/
    - tests/modules/projects/
  done_when:
    gates: [lint, types, boundaries, tests, coverage]
    assertions:
      - "Completing a milestone produces a billable position; nothing is invoiced automatically"
      - "Team membership is queryable for instance-level authorization"
  risk: low
  status: todo

- id: module-expenses
  title: Expenses — lifecycle plus the public claim portal
  phase: 3
  depends_on: [money-spine]
  spec: docs/architecture/components-core-expenses.md
  produces:
    - lib/modules/expenses/
    - tests/modules/expenses/
  done_when:
    gates: [lint, types, boundaries, tests, coverage]
    assertions:
      - "Claim tokens are single-use, expiring, and independent of the identity provider"
      - "The claim endpoint is rate limited"
      - "Approval thresholds are policy in work items, not roles"
  risk: compliance
  status: todo

- id: module-billing
  title: Billing — billable positions to Zoho handoff
  phase: 3
  depends_on: [module-projects, money-spine]
  spec: docs/architecture/components-core-billing.md
  produces:
    - lib/modules/billing/
    - tests/modules/billing/
  done_when:
    gates: [lint, types, boundaries, tests, coverage]
    assertions:
      - "Only a project manager moves a position to ready"
      - "OpsMind never issues an invoice; handoff stops at Zoho"
      - "Stale pending positions are registered as deadlines"
  risk: money
  status: todo
