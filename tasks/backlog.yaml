- id: gate-test-count
  title: A ratchet so the suite cannot quietly shrink
  phase: 0
  depends_on: [scaffold-project]
  spec: PIPELINE.md#the-gates
  produces:
    - scripts/gate.sh
    - scripts/test-guards.sh
    - tests/baseline.json
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "A drop in the runtime test count fails the gate, naming the shortfall"
      - "A deleted test file and a file whose import breaks both fail it"
      - "test_count_waiver lowers the floor only for the task that records it, and only with a reason"
      - "A missing baseline, an unreadable count or a waiver without a reason fails closed"
  risk: low
  status: done
  note: >
    Every other gate answers "did what ran pass". None answers "did everything
    still run". A file whose import breaks reports its neighbours green, a
    describe block lost in a merge resolution leaves no trace, and a refactor
    can drop cases without touching a line anyone reads.

    The count is the runtime total from vitest, not a grep for `it(`. Static
    counting misses the case this exists for — a file that still declares forty
    tests but no longer loads declares them to nobody — and it miscounts
    `it.each` tables, which expand at run time.

    Audited before building it: the count never decreased across any merged
    commit on main (109 to 230 over twelve merges), so nothing has shipped on a
    shrunken suite. The near-miss that prompted this was transient in an
    uncommitted tree, and the `tests` gate would have caught it — a grep filter
    hid the failure line, not the gate. This is defence in depth, not a hole
    being closed.

- id: gate-empty-diff
  title: An empty diff is not a pass
  phase: 0
  depends_on: [scaffold-project]
  spec: PIPELINE.md#the-gates
  produces:
    - scripts/gate.sh
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "An empty diff against the base fails the gate"
      - "Nothing-committed and nothing-changed report differently, and the first counts the uncommitted files"
      - "A diff that only deletes lines is not treated as empty"
      - "The gates below it are unaffected when a diff exists"
  risk: low
  status: done
  note: >
    The size gates measure `$base...HEAD`, so a branch with nothing committed
    measures zero and every budget reports green having weighed nothing. That
    is not hypothetical: kernel-schema-base reported size-impl pass against the
    non-overridable 400 while actually standing at 450, because the work was
    staged and not committed, and the number went into a waiver reason before a
    reviewer caught it.

    Checked with `git diff --quiet` rather than the added-line count, because a
    diff that only deletes lines adds zero and is emphatically not empty.

    The two cases print differently on purpose. "Nothing committed" is a
    process slip with an obvious fix and names how many files are waiting;
    "nothing changed" on a clean tree means the task produced nothing at all,
    which is a different conversation.

