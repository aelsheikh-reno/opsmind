    module — is Ahmed's, not this node's.

    Documentation only, so size-impl is zero (ADR-026). Report and stop.
- id: service-alerts-surface-and-lifecycle
  title: Alert Manager — the interface the deadline monitor already calls, and the four-state lifecycle
  phase: 1
  depends_on: [module-deadlines-sweep, shapes-alert-manager]
  spec: docs/architecture/flows-alerting.md
  also_read:
    - docs/architecture/components-services.md     # what it must never know
    - docs/architecture/architecture-containers.md # ADR-021, in-process behind the target interface
    - lib/modules/deadlines/index.ts               # AlertManager, ReportedAlert, RunScope
  produces:
    - lib/services/alerts/{index,lifecycle}.ts
    - tests/services/alerts/
    - docs/architecture/flows-alerting.md
    - docs/architecture/components-services.md
    - tests/baseline.json
  done_when:
    gates: [lint, types, boundaries, tests, coverage]
    assertions:
      - "The service's client satisfies the deadline monitor's AlertManager port exactly, and the compiler is what proves it"
      - "A fingerprint is an opaque identity: the engine never splits it on the separator, and two alerts differing anywhere in the string are two alerts"
      - "Severity rises in place while an alert is open and never falls; a downgrade is a resolve followed by a new alert"
      - "STALE is a flag on an open alert, not a fifth state — an alert is firing and STALE at once"
      - "Acknowledged and suppressed are open: neither closes an alert and neither resolves it"
      - "A policyId the engine holds no configuration for is accepted and recorded, never refused"
      - "No file in the service names a jurisdiction, a deadline, a document or a correlation rule"
  risk: compliance
  status: todo
  note: >
    The seam, and the pure half behind it. Same shape as the module it serves:
    domain in lifecycle.ts taking values rather than clients, index.ts the only
    public surface, the store arriving as a port so the tests need no database.
    In-process behind the target interface (ADR-021) — when the seam moves,
    index.ts becomes an HTTP client with the same signatures and ADR-009's local
    token verification lands there, with no caller change.

    IT IS WRITTEN TO A PORT THAT IS ALREADY IN PRODUCTION, which is the unusual
    thing about it. module-deadlines is merged and calls reportRun and raiseAlert
    against nothing. The port is therefore not negotiable and not a draft: the
    compiler check that the client is assignable to the module's AlertManager
    type is the node's first assertion, because a signature disagreement
    discovered later is a change to a merged compliance module.

    THE FINGERPRINT MUST STAY OPAQUE. flows-alerting.md documents the pattern
    {tenant}:{app}:{source}:{entity}:{policy} — five segments, of which the
    entity is itself compound — while fingerprintFor emits six colon-joined
    parts and escapes both ':' and the backslash inside a segment
    (deadlines-fingerprint-and-severity-result). An engine that splits on the
    separator to group or route will mis-split every deadline alert and silently
    merge two identities, which is the exact failure the escaping was added to
    prevent.

    STALE AS A FLAG IS NOT INVENTED HERE: ADR-020 fixes the lifecycle at four
    states, and flows-alerting.md says a frozen alert stays open. A fifth state
    would make "open and unconfirmed" unrepresentable.

    Roughly 150-200 implementation lines: the state predicates, the severity
    ordering, the types, and index.ts. No persistence, no verbs with side
    effects.
- id: service-alerts-store
  title: Alert Manager — its own tables, and the integration tests that exercise them
  phase: 1
  depends_on: [service-alerts-surface-and-lifecycle, gate-service-boundary-rules, kernel-repository-integration-tests]
  spec: docs/architecture/data-model.md
  also_read:
    - docs/architecture/data-ownership.md          # ADR-002, one writing owner
    - docs/architecture/decisions.md               # ADR-037, ADR-038
  produces:
    - prisma/schema.prisma
    - prisma/migrations/
    - lib/services/alerts/repository.ts
    - tests/integration/services/alerts/
    - docs/architecture/data-ownership.md
    - tests/baseline.json
  done_when:
    gates: [lint, types, boundaries, tests, coverage]
    assertions:
      - "An alert is stored once per source and fingerprint; the same fingerprint reported twice updates one row and never creates a second"
      - "Every state change is recorded as an event carrying what changed it, who and when, and no event is ever updated or deleted"
      - "The scope an alert was last reported in is stored, and an alert never reported in a scope has none"
      - "A resolved alert's row survives its resolution — nothing is deleted to close an alert"
      - "The repository declares '// owns:' and touches no table outside that declaration"
      - "Every exported repository function is exercised against a real PostgreSQL, and the suite never skips"
  risk: compliance
  status: todo
  note: >
    Lands separately from the logic it serves, and with its integration tests,
    because a Prisma call cannot be executed without PostgreSQL and diff-cov
    grades a node on the lines it changed (ADR-037). The engine above it keeps
    the store behind a port, which is what already lets its tests run without a
    database. The engine harness is ADR-038's: DATABASE_URL when present, PGlite
    over a socket otherwise, never a skip.

    OPEN, AND AHMED MUST RULE BEFORE THIS NODE IS PICKED UP — WHERE AN
    IN-PROCESS CAPABILITY SERVICE'S STORE PHYSICALLY LIVES. ADR-002 says a
    service owns its store exclusively and satellites are physically unable to
    reach PostgreSQL; architecture-containers.md says PostgreSQL is one schema
    written only by the core; ADR-021 says this thing is in-process today. All
    three are true at once and they do not compose. The two candidate shapes,
    neither chosen here.

    Shape one, its tables in prisma/schema.prisma, owned exclusively through
    '// owns:' and reached only through index.ts. Cheapest now; extraction later
    is a data migration on a live alert table, and the ADR-002 sentence is
    untrue for the whole in-process period.

    Shape two, a second datasource from day one, so extraction is a deploy
    change and never a data move, and ADR-002 is literally true from the first
    row. Costs a second migration path, a second connection pool and a second
    test harness before there is a second consumer.

    It is decided ONCE, for all seven capability services, not per service —
    service-work-items-store depends on this node purely to inherit the answer.

    ALSO OPEN: whether this store may reuse the AlertSeverity enum, which today
    sits in the deadline monitor's section of the schema. Sharing it couples
    detection to the engine across the exact seam ADR-020 exists to create. And
    retention: data-retention.md governs documents, and says nothing about how
    long a resolved alert is kept.

    Roughly 220-280 implementation lines, of which about 120 are schema and 110
    repository; generated DDL is outside size-impl (ADR-028) and inside
    size-total.
- id: service-alerts-raise
  title: Alert Manager — raiseAlert and resolveAlert, deduplicated by fingerprint
  phase: 1
  depends_on: [service-alerts-store]
  spec: docs/architecture/flows-alerting.md
  also_read:
    - lib/modules/deadlines/index.ts               # the two misconfiguration alerts, evaluate-on-register
  produces:
    - lib/services/alerts/{index,lifecycle}.ts
    - tests/services/alerts/
    - tests/baseline.json
  done_when:
    gates: [lint, types, boundaries, tests, coverage]
    assertions:
      - "Two raises of the same fingerprint produce one open alert, not two"
      - "A second raise at a higher severity raises the open alert in place; at a lower severity it leaves the severity where it was"
      - "resolveAlert is idempotent: resolving a resolved or unknown fingerprint succeeds and changes nothing"
      - "A raise for a fingerprint that is currently resolved opens it again as firing, and the earlier resolution stays in the record"
      - "The deadline monitor's misconfiguration alerts are accepted verbatim — an unconfigured policyId, raised again on every run — and produce one open alert per subject rather than one per run"
      - "An alert raised on registration and the same fingerprint later reported by a run are one alert throughout"
      - "The context a source supplies is stored whole and nothing in it is interpreted"
  risk: compliance
  status: todo
  note: >
    THIS IS THE NODE THAT MAKES A MERGED MODULE DELIVER. module-deadlines calls
    raiseAlert from registerDeadline and twice from the sweep, and until this
    exists every one of those calls goes to nothing: an unwatched deadline type
    and a jurisdiction with no calendar are detected, correctly, and then
    discarded. That is the exact failure the module was built to prevent,
    relocated one layer down.

    Dedupe spans the two verbs, deliberately. registerDeadline raises through
    raiseAlert while the sweep reports the identical fingerprint through
    reportRun, and the module's own comment says tonight's sweep either confirms
    this alert or resolves it. If the verbs held separate identities the user
    would see the same breach twice.

    OPEN, AND IT DECIDES WHETHER A BAD NIGHT COSTS ONE ALERT OR A WHOLE RUN.
    runDeadlineSweep awaits raiseMisconfiguration inside its jurisdiction loop
    with no guard — verified: there is no try or catch anywhere in that
    function, and both awaits precede reportRun. A throw from this verb rejects
    the sweep BEFORE reportRun fires, so nothing is resolved, the complete
    report never arrives, and the source goes dark — a larger failure than the
    one being reported. Either the engine never throws for a data reason, or the
    sweep grows a guard, which is an edit to a merged compliance file. Not
    decided here.

    Roughly 140-180 implementation lines: two verbs over lifecycle.ts and the
    store.
- id: service-alerts-report-run
  title: Alert Manager — reportRun, scoped completeness, and resolution by absence
  phase: 1
  depends_on: [service-alerts-raise]
  spec: docs/architecture/flows-alerting.md
  also_read:
    - docs/architecture/components-core-deadline-monitor.md
    - lib/modules/deadlines/index.ts               # RunScope, and what the sweep sends
  produces:
    - lib/services/alerts/{index,lifecycle}.ts
    - tests/services/alerts/
    - docs/architecture/flows-alerting.md
    - docs/architecture/components-services.md
    - tests/baseline.json
  done_when:
    gates: [lint, types, boundaries, tests, coverage]
    assertions:
      - "A fingerprint absent from a completed report is resolved, and the resolution names the run that closed it"
      - "Absence resolves only inside a scope the run declared complete"
      - "An incomplete scope's alerts stay open, are marked STALE, and are never resolved by absence"
      - "An empty report is a real report: it resolves everything absent in its complete scopes and records that the source ran"
      - "A report resolves nothing belonging to another source"
      - "A fingerprint present in a report opens or raises exactly as raiseAlert would, and the two verbs share one identity"
      - "The reason a scope gave for being incomplete is stored and readable on the alerts it froze"
      - "An alert stops being STALE when a later run declares its scope complete, whether that run resolves it or reports it again"
      - "The same run reported twice leaves the same state as reporting it once"
  risk: compliance
  status: todo
  note: >
    The load-bearing half of the whole engine, and the node the sweep's fourth
    argument is currently talking to nobody about. module-deadlines-sweep sends
    scopes today and its assertions already claim the behaviour — an incomplete
    jurisdiction's alerts stay open, are marked STALE and are never resolved by
    absence. Nothing implements that claim. Until this node, scopes is an
    argument the receiver discards, which is silence wearing the shape of a
    contract.

    A partial run is never presented as whole, and the healthy scopes still
    resolve normally: aborting on one bad calendar takes every jurisdiction dark
    (Ahmed, 2026-08-14, flows-alerting.md).

    AHMED MUST SETTLE ONE RULE BEFORE THIS IS PICKED UP, and both readings are
    wrong in a way a user sees. An alert raised through raiseAlert carries no
    scope. Does a completed report resolve it by absence?

    Yes, and the missing-calendar alert the same sweep raised seconds earlier is
    closed by that sweep's own report, every night, forever flapping.

    No, and an alert raised by evaluate-on-register can never close, which
    contradicts the merged module's own stated intent.

    Or a third shape: bind the scope on first report, or add a scope argument to
    raiseAlert (an edit to a merged port), or read a scope key out of context (a
    convention nobody has specified, and one that teaches the engine what a
    jurisdiction is).

    This node does not choose. It is the reason the node is written down before
    it is available.

    THE DOCUMENTED CONTRACT IS AMENDED HERE, not the code: both
    flows-alerting.md and components-services.md print a three-argument
    reportRun while the merged port takes four.

    Roughly 200-260 implementation lines. compliance, and never auto-merged:
    this is the code that decides when a compliance alert is allowed to close.
