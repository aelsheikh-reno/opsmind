      - "size-total still counts generated DDL in full and stays waivable per task"
      - "The 400 impl budget and the 800 total default are unchanged"
  risk: low
  status: done
  note: >
    kernel-schema-base measured 450 implementation lines against the
    non-overridable 400 after already being split once: 224 of authored schema
    and 164 of migration DDL that `prisma migrate diff` generates from that
    schema. All seven of its models are needed by its own four assertions, so
    the only remaining splits were to fragment the assertion set or delete the
    comments recording Ahmed's decisions. Same argument gate.sh already makes
    for lockfiles — generated, not authored, unsplittable. Recorded as ADR-028.

    ADR-027 is skipped here deliberately: it is claimed by kernel-schema-base,
    in flight, and is already cited from three documents on that branch.

- id: harness-legacy-prisma-client
  title: Give the legacy oracle its own Prisma client
  phase: 0
  depends_on: [harness-differential]
  spec: PIPELINE.md#the-problem-this-design-solves
