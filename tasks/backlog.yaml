      - "An inhibiting alert silences its dependents' notifications while both are open, and neither alert's state moves"
      - "A source-dark alert inhibits its own source's alerts, which is the general rule doing the specific job"
      - "The legacy digest's grouping is reproduced: one message per recipient per run, sectioned, rather than one message per item"
  risk: compliance
  status: todo
  note: >
    Noise control, and the one place in the engine where the legacy build is a
    real oracle: buildExpiryReminderHtml already collapses a run's expiries into
    one sectioned digest, which is the behaviour this generalises. Hence a
    differential test rather than an assertion written from prose alone.

    LIFECYCLE IS UNTOUCHED BY ANY OF IT. Grouping and inhibition act on
    notifications; an inhibited alert is still open, still counted, still
    resolvable, still addressable. An engine that silenced state instead of
    delivery would close alerts nobody looked at.

    IT HAS NOWHERE TO DELIVER, and that is a gap in the graph rather than in
    this node: the Notifications service has no backlog node at all. This node
    produces grouped notification intents behind a Notifications port — the same
    port shape every other boundary in this build uses — and delivery lands with
    that service.

    SPLIT SEAM, NAMED IN ADVANCE. Roughly 250-330 implementation lines is the
    estimate and it is the least certain one here. If it measures over 400 the
    cut is grouping first, inhibition second: inhibition needs a rule table
    grouping does not, and grouping is what the legacy oracle covers.
- id: deadlines-alert-manager-wiring
  title: The deadline monitor's alert port is bound to the Alert Manager
  phase: 1
  depends_on: [service-alerts-report-run, service-alerts-source-registry]
  spec: docs/architecture/components-core-deadline-monitor.md
  also_read:
    - docs/architecture/operations-scheduling.md   # the 02:00 sweep, and job_runs
    - docs/architecture/architecture-containers.md # ADR-021, the seam is a function call today
  produces:
    - lib/services/alerts/index.ts
    - lib/modules/deadlines/repository.ts
    - app/api/internal/deadlines/sweep/route.ts
    - tests/integration/deadlines-alerts.test.ts
    - docs/architecture/operations-scheduling.md
    - tests/baseline.json
  done_when:
    gates: [lint, types, boundaries, tests, coverage]
    assertions:
      - "DeadlineDeps.alerts is the Alert Manager's client in production, constructed in exactly one place"
      - "A sweep run end to end leaves alerts readable from the Alert Manager's store, with the scopes the run declared"
      - "The tenant on DeadlineDeps is configuration and is refused when unset, never defaulted"
      - "A registration inside a threshold raises one alert, and that night's sweep either keeps it or resolves it — one fingerprint throughout"
      - "Nothing outside the composition root reaches the service other than through lib/services/alerts/index.ts"
      - "A jurisdiction with no calendar leaves its alerts open and STALE while every other jurisdiction resolves normally, proved against a real database"
  risk: compliance
  status: todo
  note: >
    The proof that the two halves meet. Everything above is tested against
    ports; this is the first run where a real sweep writes real alerts to a real
    store, and it is where a signature or semantic disagreement between a merged
    module and a new service actually surfaces.

    THE SWEEP STILL HAS NOTHING TO FIRE IT, and that is not this node's to fix.
    No node in the graph schedules anything: operations-scheduling.md's 02:00
    Asia/Dubai run has no caller, and job_runs — the unique (job, scheduled_for)
    claim that makes duplicate runners collide harmlessly, and the defect the
    legacy build already has from firing crons twice — has no table, no owner
    and no node. This node gives the sweep an entry point a scheduler can call.
    The scheduler itself needs a node of its own; recorded here rather than
    invented inside a compliance PR.

    Roughly 100-150 implementation lines. It also carries
    lib/modules/deadlines/repository.ts, which left module-deadlines-sweep under
    ADR-037 and needs the same integration harness this node uses.
