    lives on BusinessCalendar beside the weekend mask and holidays — Jurisdiction
    is identity, BusinessCalendar is the civil-time rules. No schema field
    carried one, so this node adds it.

    Assertion 7 of module-deadlines-sweep, "the sweep scores against the
    jurisdiction's civil date, not UTC", deliberately stays on that node rather
    than moving here: it is a claim about the sweep, and the test that pins it
    drives a sweep. This node pins the field and the function the sweep then
    uses.

    The three docs/architecture pages are in produces because all three state
    the rule this node changes: data-model.md specifies BusinessCalendar's
    columns, the monitor page says what "today" means, and the scheduling page
    carries the unqualified 02:00 that is the ambiguity itself. They were
    missing from the first cut of this node, which is how the drift was designed
    in rather than overlooked; docs/ and *.md are excluded from size-impl, so
    naming them costs the node nothing.

- id: module-deadlines-thresholds
  title: Deadline monitor — threshold windows, severity and the fingerprint
  phase: 1
  depends_on: [module-deadlines]
  spec: docs/architecture/components-core-deadline-monitor.md
  also_read:
