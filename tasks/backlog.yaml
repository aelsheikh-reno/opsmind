- id: docs-architecture-spec
  title: Commit the architecture specification
  phase: 0
  depends_on: [gate-size-docs-exclusion]
  spec: PIPELINE.md#the-problem-this-design-solves
  size_total: 2100
  size_waiver_reason: >
    1790 of the ~1945 lines are the 40 specification pages themselves — prose,
    which no split makes more reviewable and which every phase 1+ task needs
    present before it can start. Implementation is the backlog graph alone,
    well inside the unchanged 400. ADR-026 keeps the prose out of size-impl;
    this waiver covers the backstop it is still counted against.
  produces:
    - docs/architecture/
    - tasks/backlog.yaml
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "Every spec and also_read path on a node that is not yet done resolves to a committed file"
      - "The graph records what has merged, and no node's status is invented"
      - "decisions.md keeps ADR-026, which landed ahead of it with the gate change"
  risk: low
  status: todo
  note: >
    The specification was committed on task/harness-exact-minor-scaling, a
    branch named for a task that merged as #10, and could not land while
    markdown counted against the 400-line code budget. gate-size-docs-exclusion
    removed that; this carries the pages themselves, plus the phase 1-3 nodes
    they make buildable.
