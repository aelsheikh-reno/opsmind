      - "An acknowledged alert still open when its resolve window lapses re-escalates"
      - "Suppression is bounded by an instant the caller supplies; there is no unbounded suppress"
      - "An expired suppression returns the alert to firing with no new raise"
      - "Every acknowledgement records its actor, and every suppression records its actor and its reason"
      - "Suppression acts on a fingerprint, so an alert raised again while suppressed is recorded and stays quiet"
      - "The engine records who acted and never decides whether they were allowed to"
  risk: compliance
  status: todo
  note: >
    The two human verbs, and the one place the lifecycle can be moved by
    somebody rather than by a source. Acknowledgement that closes is the failure
