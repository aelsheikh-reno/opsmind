    - docs/architecture/flows-alerting.md
    - docs/architecture/open-items.md
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "Every column the Alert Manager stores is specified before any of it is built: the alert, its state, its severity, its scope, its event log and its sources"
      - "The four states are the four ADR-020 names, and STALE is specified as a flag on an open alert rather than a fifth state"
      - "The documented reportRun contract carries the scopes argument the merged port already takes"
      - "Nothing in the shape names a jurisdiction, a deadline or a document — the scope key is opaque and is documented as opaque"
      - "The questions this shape cannot answer are listed in open-items.md and none of them is answered here"
  risk: low
  status: todo
  note: >
    Written before the store, for the reason spec-coverage-audit exists:
    inventing a data model inside an implementation PR under a size budget is
    how DeadlineRegistration and ThresholdTable ended up specified by one cell
    of data-ownership.md. flows-alerting.md is rich on behaviour and silent on
    columns; data-model.md has no alert card at all.

    THE DOCUMENTED CONTRACT IS ALREADY STALE. flows-alerting.md and
    components-services.md both print reportRun(sourceId, runId, alerts[]). The
    merged port takes a fourth argument, scopes, and scoped completeness is
    stated in that same page's prose three sections down. The doc is corrected
    to the shipped shape rather than the shipped shape to the doc: the argument
    is what carries the rule the page calls load-bearing.

    THE SCOPE KEY IS A DOMAIN LEAK, and it is recorded rather than fixed here.
    ReportedAlert.jurisdictionId names an OpsMind concept in the one contract
    the extraction criterion says a second product must use unchanged. The
    engine can satisfy it structurally and treat it as opaque, which is what the
