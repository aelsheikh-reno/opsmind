    Recorded as ADR-029.

- id: fix-staging-deploy-waiver
  title: Restore staging-deploy's waiver reason
  phase: 0
  depends_on: [kernel-entities-law]
  spec: PIPELINE.md#the-gates
  produces:
    - tasks/backlog.yaml
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "staging-deploy's size_waiver_reason describes staging-deploy"
      - "Every waived node has exactly one waiver reason, and it is its own"
  risk: low
  status: todo
  note: >
    A scripted edit in #30 anchored on the file's first size_waiver_reason,
    which is staging-deploy's, and overwrote it with kernel-entities-law's text.
    The guard "the committed waiver is printed with its recorded reason" caught
    it; the merge went ahead anyway because the polling loop treated a FAILURE
    verdict as a reason to stop waiting rather than a reason to stop.

    It exists as a node rather than a chore branch for a second reason worth
    recording: main's line coverage is now 84.41%, below the 90 the strict path
    demands, so a branch that resolves no risk fails the coverage gate outright.
    Every fix from here needs a node until the kernel repositories are covered
    or the strict floor is reconsidered.

- id: gate-merge-verdict
  title: A red gate must block a merge
  phase: 0
  depends_on: [gate-empty-diff]
  spec: PIPELINE.md#the-gates
  produces:
    - scripts/merge-when-green.sh
    - scripts/test-guards.sh
    - .claude/commands/build-task.md
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "The verdict is re-read immediately before merging, never trusted from earlier"
      - "Any conclusion that is not SUCCESS refuses the merge and names which"
      - "An unreadable verdict, or none at all, fails closed"
      - "build-task merges only through the guard, never through gh directly"
  risk: low
  status: done
  note: >
    On #30 the gates reported FAILURE, the polling loop watching them treated
    FAILURE as a terminal state to stop waiting on, and the next command merged
    without re-reading anything. Terminal-and-failed and terminal-and-passed
    shared a code path. A red gate reached main, and the guard that caught the
    defect — "the committed waiver is printed with its recorded reason" — had
    fired by name and been ignored.

    There is no branch protection catching this server-side, so the merge step
    itself has to read the verdict. Making it a script rather than a rule in
    prose is the point: a rule depends on whoever is holding it next.

    Verified by making it refuse. Fifteen probes cover FAILURE, CANCELLED,
    TIMED_OUT, ACTION_REQUIRED, SKIPPED, STALE, still-pending, no checks at all,
    one red among green, a non-OPEN pull request, unreadable JSON and a verdict
    with no state — and a real pull request with a deliberately failing test was
    opened, refused with exit 1, and closed unmerged.

- id: gate-mark-task-done
  title: The status flip is a script, and it touches one line
  phase: 0
  depends_on: [gate-merge-verdict]
  spec: PIPELINE.md#the-gates
  produces:
    - scripts/mark-task-done.sh
    - scripts/test-guards.sh
    - .claude/commands/build-task.md
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "It anchors on the node id, never on a field name"
      - "It refuses an unknown id, a node already done, and any diff other than one changed line"
      - "It reverts its own edit when it refuses"
      - "build-task flips status only through it"
  risk: low
  status: done
  note: >
    Six occurrences of the status lag and three /next selections that returned
    already-built work. Writing the flip into build-task.md as an instruction
    was the previous answer, and the merge bug settled what an instruction in
    that file is worth: it said merge only when green, and a red gate reached
    main anyway.

    Deliberately narrow, because tasks/backlog.yaml has two writers and a
    scripted edit anchoring on the file's FIRST size_waiver_reason destroyed
    staging-deploy's — twelve nodes from the one it meant. This anchors on the
    node id, edits inside that node's block, then checks the damage rather than
    trusting itself: anything other than one changed line in one file is
    reverted and refused.

- id: flip-gate-nodes
  title: Record gate-merge-verdict and gate-mark-task-done as merged
  phase: 0
  depends_on: [gate-mark-task-done]
  spec: PIPELINE.md#the-gates
  produces:
    - tasks/backlog.yaml
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "Both nodes read done, flipped by scripts/mark-task-done.sh"
  risk: low
  status: done
  note: >
    A node only because a branch without one takes the strict path and fails
    coverage — see gate-coverage-strict-path below.

- id: gate-coverage-strict-path
  title: The strict-path coverage floor is unreachable on main
  phase: 0
  depends_on: [kernel-entities-law]
  spec: PIPELINE.md#the-gates
  produces:
    - scripts/gate.sh
    - scripts/coverage-gate.sh
    - tests/baseline.json
    - docs/architecture/decisions.md
    - tests/gates/coverage-gate.test.ts
    - PIPELINE.md
    - tasks/backlog.yaml
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "Coverage is measured on the lines the task changed: 90% for money and compliance, 70% for low"
      - "Total repository coverage must not decrease against the stored baseline"
      - "A task adding uncovered new code fails diff coverage"
      - "A task that lowers total coverage fails the ratchet"
      - "An unreadable coverage report fails closed"
      - "A missing or unparseable baseline fails closed"
      - "A coverage waiver with no reason fails closed, and a waiver in use is printed with its reason"
      - "Lowering the stored coverage_bp below the base's needs the same waiver an actual decrease needs"
      - "lib/kernel/*/repository.ts stays measured — no path is excluded to make the gate pass"
      - "A diff with no coverable lines passes, and says so rather than passing silently"
      - "A branch that resolves no task can still pass the gates on a clean main"
  risk: low
  blocks_product: true
  status: done
  note: >
    BLOCKS PRODUCT. It is infrastructure, but it blocks every compliance node in
    the graph — all three module-deadlines-sweep nodes among them — so it is
    built ahead of product work rather than behind it (Ahmed, 2026-08-15).

    A branch that is not task/<id> resolves no risk, so gate.sh takes the strict
    path and demands 90 — which means every chore branch fails on code it did not
    touch. Two have already had to be given a node purely to get through (#32 and
    #37), which is a workaround wearing a node's clothes. Since then it stopped
    being only a chore-branch problem: module-deadlines-civil-date measures 100%
    on every line it wrote and still fails at 79.41%, because the denominator is
    the whole repository.

    THE FIX IS THE DENOMINATOR, NOT THE FLOOR. 90 is right and stays. Coverage is
    measured on the lines the task changed, at 90 for money and compliance and 70
    for low. A second, independent check ratchets TOTAL repository coverage so it
    cannot decrease — diff coverage alone would let the total rot one uncovered
    file at a time. The baseline is stored beside the test-count ratchet in
    tests/baseline.json with a per-task waiver that requires a reason, exactly as
    size_total and test_count_waiver do.

    Everything fails closed: an unreadable coverage report, a missing baseline,
    and a waiver with no reason are all failures, because a coverage gate that
    measured nothing must not print the same word as one that measured and
    passed.

    lib/kernel/*/repository.ts is NOT excluded. Repositories are what payroll and
    the money spine read through, and an excluded file is one nobody looks at
    again. Raising them is kernel-repository-integration-tests below, which this
    node deliberately does not do.

- id: gate-test-count-base-ratchet
  title: The test-count floor is read from the working tree, so it can be edited away
  phase: 0
  depends_on: [gate-coverage-strict-path]
  spec: PIPELINE.md#the-gates
  produces:
    - scripts/gate.sh
    - tests/gates/test-count-ratchet.test.ts
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "The tests floor is resolved from the PR base as well as the working tree"
      - "A branch lowering the stored tests value requires test_count_waiver with a reason"
      - "Raising it, or leaving it alone, stays free"
      - "A base whose baseline cannot be read fails closed"
  risk: low
  status: todo
  note: >
    The hole gate-coverage-strict-path closed on coverage_bp is still open on the
    key beside it. scripts/gate.sh reads test_baseline from the working tree's
    tests/baseline.json and never compares it against the base, so a task can
    lower "tests" and skip test_count_waiver entirely — the same defeat, on the
    same file, one key across.

    Found by review on that node and recorded rather than fixed there: size-impl
    stood at 399 of an unwaivable 400, and a backlog node costs implementation
    lines. ADR-030 states it as open rather than tracked, deliberately, so this
    node is what makes that record true.

    The fix is the one already written for coverage_bp — resolve from
    `git show "$base:tests/baseline.json"`, treat a lower value on the branch as
    a decrease, require the waiver that already exists. Copy that shape rather
    than inventing a second one.

- id: gate-coverage-lcov-reconciliation
  title: An lcov report that does not reconcile with the diff must fail, not pass
  phase: 0
  depends_on: [gate-coverage-strict-path]
  spec: docs/architecture/decisions.md#adr-030
  produces:
    - scripts/coverage-gate.sh
    - tests/gates/coverage-gate.test.ts
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "A diff touching files under the coverage roots with none of them in the report fails"
      - "A docs-only or app/-only diff still passes with 'no coverable lines changed'"
      - "The coverage roots the check uses stay in step with coverage.include in vitest.config.ts"
  risk: low
  status: todo
  note: >
    scripts/coverage-gate.sh reconciles lcov SF: records against the diff by
    stripping a $PWD/ prefix, which handles the repo-relative form the v8
    provider writes today and the absolute-under-$PWD form. Any third spelling —
    `SF:./lib/a.ts` is the demonstrated one — matches no changed file, and the
    gate reports "no coverable lines changed" and PASSES a diff of uncovered
    lines.

    Latent rather than live: the current provider writes the plain form, so this
    is a provider upgrade away, not a bug today. It matters because it is the one
    path where diff-cov degrades from measuring to passing rather than to
    failing, which is the opposite of every other path in that script — and the
    whole design premise is that a gate which measured nothing must never print
    the same word as one that measured and passed.

    The check must be scoped precisely: if the diff changes files under the
    coverage.include roots and not one of them appears in the report, that is an
    unreconciled report, not an empty diff. A docs-only or app/-only task changes
    no file under those roots and must still pass.

    Deferred from gate-coverage-strict-path for the 400-line budget, not because
    it is acceptable. Recorded in ADR-030.

- id: gate-stale-input-refusal
  title: The gate measures the committed diff and never says which commit that was
  phase: 0
  depends_on: [gate-coverage-strict-path]
  spec: PIPELINE.md#the-gates
  produces:
    - scripts/gate.sh
    - scripts/test-guards.sh
    - .github/workflows/gates.yml
    - tests/gates/stale-input.test.ts
    - tests/baseline.json
    - docs/architecture/decisions.md
    - PIPELINE.md
    - tasks/backlog.yaml
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "gate.sh prints the commit SHA it measured on every run, pass or fail, in the gate column format"
      - "An uncommitted change to a file the gate measures fails the run and names the file"
      - "An untracked file in a measured path counts as dirty"
      - "--summary refuses on a stale tree exactly as the full suite does"
      - "A change confined to a path the gate does not measure still runs — it does not over-refuse"
      - "The refusal exits before any other gate prints a verdict"
      - "A tree the gate cannot read is refused in different words from a dirty one, and git's own stderr is printed"
      - "gate.sh's full suite runs scripts/test-guards.sh as a gate line, so a broken guard is caught before the PR and not by CI"
      - "The guard line is in the full suite only, because the fixtures call --summary and would otherwise re-enter it without terminating"
      - "Every fixture scripts/test-guards.sh builds is a real git repository with a clean tree, so each probe runs the code path a real run takes"
      - "The refusal is not softened for the fixtures — no flag, no environment variable and no shape test turns it off in a real checkout"
      - ".github/workflows/gates.yml runs the guard suite exactly once, through gate.sh"
  risk: low
  blocks_product: true
  status: done
  note: >
    THE DEFECT, OBSERVED. gate.sh was run on module-deadlines-sweep, printed ALL
    GATES PASS including size-total, the work was then committed, and the true
    figure was 2746 against a limit of 1700 — a FAIL. The gate had weighed the
    PREVIOUS commit and printed the same word a correct run prints.

    Fourth instance of one pattern: the stale baseline read on every run;
    gates=FAILURE treated as a terminal state to stop waiting on, which merged a
    red gate (#30); an empty diff reading as green, which reported size-impl pass
    on a 450-line task against 400; and this one. The generalising rule is that a
    check must state what it measured and refuse when it cannot measure the thing
    it claims to. Recorded as ADR-031.

    BLOCKS PRODUCT. Every size and coverage verdict in the repository is a claim
    about a commit nobody named, so no merged number can be trusted to be about
    the tree it merged.

    Do not soften the refusal for --summary. The Stop hook calls it after every
    turn, so a summary that silently measures a different tree is the same defect
    at higher frequency. The accepted cost is that the gate can no longer be run
    mid-edit for a quick read.

- id: gate-suite-flakiness
  title: A suite that is sometimes wrong teaches everyone to retry instead of read
  phase: 0
  depends_on: [gate-stale-input-refusal]
  spec: PIPELINE.md#the-gates
  produces:
    - tests/scaffold/eslint-boundaries.test.ts
    - vitest.config.ts
    - eslint.config.mjs
    - templates/eslint.config.mjs
    - docs/architecture/decisions.md
    - tasks/backlog.yaml
    - tests/baseline.json
    - .gitignore
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "The full suite passes repeatedly under load, and the measured pass rate is reported"
      - "The bound reflects what the work actually costs, and says so where it is set"
      - "A hook that exceeds its bound fails naming what it was doing, never as a bare timeout"
      - "An agent worktree under .claude/worktrees/ is never linted, so reference/legacy cannot be rescanned through it"
      - "Adding a test file does not change whether an unrelated file passes"
  risk: low
  blocks_product: true
  status: done
  note: >
    BLOCKS PRODUCT. A false red is the same class of defect as a false green:
    both mean the verdict does not describe the subject (Ahmed, 2026-08-16).

    tests/scaffold/eslint-boundaries.test.ts has a beforeAll bounded at vitest's
    default 10s that takes 10.2-14.3s under load. It dynamically imports two
    eslint flat configs, and importing eslint.config.mjs pulls the whole
    typescript-eslint graph — the work is genuinely expensive, so the bound is
    wrong rather than the test being stuck. It passed 3/3 standalone and failed
    roughly half of eight gate runs while another agent was working.

    The trigger is not the file that fails. ANY new test file adds a concurrent
    worker and tips it, so the next node to add tests inherits a red suite it
    did not cause. gate-stale-input-refusal took the count from 22 to 23 and was
    the last one that fitted.

    Raise or remove the bound rather than reaching for the timeout alone: if the
    import is what costs, say so where the number is set, so the next person to
    see the figure does not read it as a budget the test overran.

    Why it is worth a node: a gate that is sometimes wrong teaches everyone to
    retry instead of read, and that is how the stale baseline went unread for
    twelve merges. The retry habit is the damage, not the minutes.

    Carries the durable eslint fix too. An agent worktree under
    .claude/worktrees/ is a full second checkout including reference/legacy/,
    and eslint scanned it and reported 935 errors in the outer repository. It is
    gitignored now, but eslint's flat config does not read .gitignore, so the
    ignore must be stated in the config or it recurs on the next worktree agent.

- id: gate-eslint-ignores-generated-output
  title: eslint still lints coverage/, a gitignored path the config does not name
  phase: 0
  depends_on: [gate-suite-flakiness]
  spec: PIPELINE.md#the-gates
  produces:
    - eslint.config.mjs
    - templates/eslint.config.mjs
    - tests/scaffold/eslint-boundaries.test.ts
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "npx eslint . reports nothing from coverage/, and the ignore is stated in the config rather than left to .gitignore"
      - "The ignore is named in ALLOWED_EXTRA_IGNORES with its reason, so the template comparison still holds"
  risk: low
  status: todo
  note: >
    Found while fixing gate-suite-flakiness and deliberately not fixed there
    (ADR-033, "What this record does not fix"). eslint flat config does not read
    .gitignore, so coverage/ — regenerated by `vitest run --coverage` on every
    gate run — is walked by `npx eslint .` and reports a warning from
    coverage/lcov-report/block-navigation.js. It changes no verdict today
    because it is a warning and not an error, which is exactly why it will sit
    there: the day a generated report carries something eslint calls an error,
    the lint gate goes red on output nobody wrote. Same hole as
    .claude/worktrees/, one path over.

    Note that coverage/** is NOT a free addition: the global ignore list is now
    compared against templates/eslint.config.mjs, because an ignore switches
    every rule off for a path and was the one remaining way to soften a boundary
    rule invisibly. Adding it means naming it in ALLOWED_EXTRA_IGNORES with a
    reason, or adding it to the template too.

- id: gate-suite-test-timeouts
  title: Six more files run under vitest's default 5s testTimeout and go red on a busy machine
  phase: 0
  depends_on: [gate-suite-flakiness]
  spec: PIPELINE.md#the-gates
  produces:
    - tests/gates/coverage-gate.test.ts
    - tests/gates/stale-input.test.ts
    - tests/modules/deadlines/civil-date-unit.test.ts
    - tests/config/legacy-prisma-client.test.ts
    - tests/kernel/kernel-regime-data.test.ts
    - tests/differential/harness.test.ts
    - tests/baseline.json
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "Every bound raised is set from a measurement of what that test's work costs, written where the number is set"
      - "The full suite passes repeatedly at 2x core oversubscription, and the measured pass rate is reported"
  risk: low
  status: todo
  note: >
    Found by gate-suite-flakiness's own verification and NOT fixed there — the
    files are outside that node's produces, and each bound has to be set from
    its own measurement rather than from one blanket number.

    That node fixed the beforeAll in tests/scaffold/eslint-boundaries.test.ts
    and the suite went from 1/10 to 10/10 at twelve background CPU hogs on a
    14-core machine (`nproc` = 14, load1 8.8-20.1). Pushed further, to 28 hogs
    and load1 27.6-39.8, it measured 5/10 — and the eslint hook was in none of
    the five red runs. The failures were `Test timed out in 5000ms`, vitest's
    default testTimeout, in the six files above: mostly tests that spawn a
    subprocess or read the real filesystem, so their wall clock tracks the
    machine and not the assertion.

    Same defect as gate-suite-flakiness, one bound over: a default nobody chose
    for the work, sitting close enough to the work's real cost that contention
    crosses it. The verdict then describes the machine instead of the subject,
    and the remedy it teaches is to re-run. See ADR-033.

    28 hogs is 2x oversubscription and beyond the 5.4-12.0 load window observed
    in the wild, so this is not currently producing false reds. It will as the
    suite grows, and it is the reason the next node to add test files should
    re-measure rather than assume gate-suite-flakiness settled the question.

- id: overdue-severity
  title: An overdue deadline takes the highest severity configured for its type
  phase: 1
  depends_on: [module-deadlines-thresholds]
  spec: docs/architecture/components-core-deadline-monitor.md
  produces:
    - lib/modules/deadlines/thresholds.ts
    - tests/modules/deadlines/thresholds.test.ts
    - docs/architecture/components-core-deadline-monitor.md
    - tasks/backlog.yaml
    - tests/baseline.json
  done_when:
    gates: [lint, types, boundaries, tests, coverage, differential]
    assertions:
      - "An overdue deadline reports the highest severity configured for its type, not the top band of the severity scale"
      - "A type configured with only minor windows reports minor once overdue, and that alert still fires and is still reported"
      - "A type with no ThresholdTable row is still unconfigured when overdue, never scored as safe"
      - "The spec sentence, the test and this assertion change together, so no commit leaves the build self-contradictory"
  risk: compliance
  status: todo
  note: >
    Restores the per-type ceiling. An overdue deadline breaches every window its
    type has and reports the highest severity configured FOR THAT TYPE, so a type
    whose Settings rows are all minor reports minor however far past due it runs.
    The severity column in Settings is how an administrator says "this type is
    never urgent", and an overdue stationery order at the same band as a lapsed
    visa empties the top band of meaning.

    This node earlier scored overdue at the top band of the SEVERITY SCALE
    instead. That reversal was made on a false premise and is withdrawn (Ahmed,
    2026-08-16; the error is his). Both grounds failed:

    Legacy is SILENT on this case rather than agreeing with either reading. Its
    digest never collects an already-expired document, invoice or schedule —
    every collection query is `gte: now` — so nothing but an unprocessed payroll
    run reaches its overdue bucket, and on an expired visa it has no opinion at
    all. It is not louder than this build there, so there is no legacy oracle for
    this rule and none is cited: legacy_reference is deliberately absent.

    A minor-only type reporting minor is NOT silence. The alert fires, appears in
    the run and is reported; severity governs urgency, not visibility. The
    reversal read a low band as no alert.

    Unconfigured is untouched. A type with no ThresholdTable row is still
    unconfigured rather than scored, overdue or not: absence of a row is a hole,
    not a severity, and the sweep raises a misconfiguration alert for it.

    The decoupling this node's test work introduced stays: the overdue rule is
    pinned in exactly one describe, other blocks defer to it by reference rather
    than restating it, the two property tests hold non-negative domains, and the
    0-versus-minus-1 boundary is pinned in both directions. That is why this
    reversal is cheap, and it is the shape to keep if the rule moves again.

- id: settings-warn-minor-only-threshold-type
  title: Settings warns when a deadline type has no window above the lowest severity
  phase: 1
  depends_on: [overdue-severity]
  spec: docs/architecture/components-core-deadline-monitor.md
  produces:
    - lib/modules/deadlines/{thresholds,index}.ts
    - tests/modules/deadlines/
    - docs/architecture/components-core-deadline-monitor.md
  done_when:
    gates: [lint, types, boundaries, tests, coverage]
    assertions:
      - "A deadline type whose every ThresholdTable row carries the lowest severity is flagged in Settings, naming the type"
      - "The flag says what it means: this type can never report above the lowest band, overdue included"
      - "A type with at least one window above the lowest severity is not flagged"
      - "The warning never blocks the save, exactly as the misordered-threshold warning does not"
  risk: low
  status: todo
  note: >
    WARN, NEVER BLOCK — the same shape as the misordered-threshold warning the
    spec already describes (a tighter window carrying a lower severity is flagged
    as probably misconfigured without preventing the save). Match that one: same
    surface, same non-blocking behaviour, same register of wording.

    It exists because a minor-only threshold table is BOTH a legitimate
    expression of "this type is never urgent" AND a plausible mistake — someone
    filled in the windows and never revisited the severity column — and only the
    administrator can tell which. Since overdue-severity restored the per-type
    ceiling, such a type can never report above the lowest band, not even past
    due; that is correct when it was meant and invisible when it was not, so
    Settings says it out loud and leaves the decision where it belongs. Blocking
    the save would forbid the legitimate case outright.

    Open, for the implementing node to settle with Ahmed rather than choose: a
    type with NO rows at all is already the sweep's unconfigured-type alert, so
    whether it is also flagged here or deliberately left alone is undecided.
    Declared only — do not build with this node's parent.

- id: gate-size-impl-exclude-comments
  title: A comment is not implementation, and charging it makes deletion the cheapest green
  phase: 0
  depends_on: [gate-stale-input-refusal]
  spec: PIPELINE.md#the-gates
  size_total: 1800
  size_waiver_reason: >
    1048 of 1750 added lines are tests, task prose and documentation, against
    317 of implementation. Identical shape to every waiver ADR-029 catalogued,
    and identical to the argument accepted for the three sweep nodes. Cutting
    the test file to fit would remove the four shell demonstrations and the
    polarity cases — which is the behaviour this node exists to eliminate.
    Ahmed, 2026-08-17.
  produces:
    - scripts/gate.sh
    - scripts/size-impl.mjs
    - scripts/test-guards.sh
    - tests/kernel/kernel-source.ts
    - tests/gates/size-impl-comments.test.ts
    - docs/architecture/decisions.md
    - PIPELINE.md
    - tasks/backlog.yaml
    - tests/baseline.json
  done_when:
    gates: [lint, types, tests, guards]
    assertions:
      - "A comment-only line does not count toward size-impl in any source language this repository writes: .ts, .tsx, .mjs, .cjs, .js, .sh"
      - "A blank line does not count toward size-impl"
      - "A line carrying code and a trailing comment counts as code, in full"
      - "// inside a string literal, a template literal or a JSX expression counts as CODE, never as a comment"
      - "The classification comes from the TypeScript compiler API through the kernel-source reader, never a regex; .mjs, .cjs and .js go through that same reader under ts.ScriptKind.JS"
      - "In shell a # inside a single-quoted string, inside a double-quoted string, inside a heredoc, on the shebang line, or not at a word boundary counts as CODE, and a trailing # counts the line in full"
      - "A shell file the reader cannot follow to the end is refused, never counted"
      - "tasks/backlog.yaml contributes nothing to size-impl and every line to size-total"
      - "size-impl stays 400 and never-waivable; size-total counts every line as before"
      - "A 450-line diff with no comments is still refused"
- id: agent-loop-discipline
  title: Plan before build, verify before claiming, annotate briefly, stop at three
  phase: 0
  depends_on: []
  spec: PIPELINE.md#the-agents
  produces:
    - .claude/commands/build-task.md
    - .claude/agents/implementer.md
    - .claude/agents/reviewer.md
    - .claude/agents/test-author.md
    - docs/architecture/decisions.md
    - tasks/backlog.yaml
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "build-task plans before implementing: files, estimated impl lines each, assertions to files, both budgets, unmerged dependencies"
      - "An estimate over either budget proposes the split in the plan and stops for Ahmed"
      - "A built result diverging from the plan by more than 25% on impl lines is reported with what was missed"
      - "No claim of passing, verified or mutations killed without the command, the commit and the output in the same message"
      - "A claim relayed from a subagent is re-run or attributed as unverified"
      - "The comment limits appear in implementer.md and reviewer.md in identical words"
      - "The reviewer still fails a comment contradicting its code or recording a superseded decision, in one review"
      - "Three attempts per task counted across every gate, not three per gate, and the third stops for Ahmed"
  risk: low
  blocks_product: true
  status: todo
  note: >
    BLOCKS PRODUCT. It is blocking module-deadlines-sweep right now, and every
    way past it games the gate (Ahmed, 2026-08-16).

    THE EVIDENCE THE 400 RESTS ON ARGUES AGAINST CHARGING COMMENTS. The figure
    comes from the SmartBear/Cisco study of reviewer cognitive load — how much
    diff a human can review before defect detection collapses. That same study
    found that authors who ANNOTATE their changes ship materially fewer defects,
    because annotating forces self-review. Charging annotations to the code
    budget makes deleting them the cheapest path to green, which inverts the
    finding the threshold rests on. ADR-026 and ADR-028 already reached this
    conclusion for documentation and generated DDL; this is the same argument
    about the third artifact a reviewer reads.

    The case that forced it: module-deadlines-sweep measured EXACTLY 400 and
    went 3 over solely by correcting a comment that had become false — the
    MissingBusinessCalendarError doc said a missing calendar aborts the run,
    which that node makes untrue. The correction IS the work, and the gate
    charged it as if it were new implementation.

    EVERY SOURCE LANGUAGE, AND THE BACKLOG IS OUT (Ahmed, 2026-08-17 — ONE
    ruling, both halves). The discount applies to .ts, .tsx, .mjs, .cjs, .js and
    .sh, because nothing in the SmartBear/Cisco finding is about a file
    extension. The first pass discounted TypeScript alone for no better reason
    than that the case which forced it arose there, which left scripts/gate.sh —
    560 lines of shell carrying more reasoning than code, and the file that RUNS
    this budget — still paying for its own explanation, along with the two
    eslint configs. And tasks/backlog.yaml is excluded from size-impl entirely:
    a node is a title, a dependency edge, a produces list and the reasoning
    behind them, which is planning rather than authored source, and a budget for
    reviewer cognitive load ON CODE must not make a thinner node the cheapest
    way to pass. size-total still counts every line of all of it.

    COMPILER API, NEVER A REGEX. This repository has already been bitten by a
    line scanner reading declarations inside string literals as real exports,
    which is why tests/kernel/kernel-source.ts exists. A `//` inside a string, a
    template literal or a JSX expression is code and must count as code; only
    the compiler can tell the difference. The reader already collects comments
    as CommentRanges with line positions, so this extends it rather than
    inventing a second parser. JavaScript goes through the SAME reader under
    ts.ScriptKind.JS — one implementation, or the suite grades only one of two.

    SHELL IS THE PART WITH NO COMPILER, so it is the part to get right. A `#`
    inside a single-quoted string, inside a heredoc (<<, <<-, <<'EOF' and
    <<"EOF" alike), on the shebang line, or anywhere that is not a word boundary
    — foo#bar, ${x#prefix} — is CODE, and a trailing # counts its line in full.
    The reader states what it does not handle rather than pretending otherwise,
    every ambiguity resolves towards code because over-counting a budget can
    never let an oversized task through, and where it has lost the thread it
    refuses (ADR-031).

    A line carrying code and a trailing comment counts as CODE, in full. No
    partial credit: the alternative is a gate that rewards moving explanation
    onto the same line as the code it explains.

    THE COST, RECORDED: size-total is now the only budget holding the line on a
    comment-heavy diff, and it is the waivable one.

- id: gate-size-impl-guard-fixtures
  title: The size probes need what a real gate run needs — a compiler and the reader
  phase: 0
  depends_on: [gate-size-impl-exclude-comments]
  spec: docs/architecture/decisions.md#adr-035
  produces:
    - scripts/test-guards.sh
  done_when:
    gates: [lint, types, tests, guards]
    assertions:
      - "Every size probe in scripts/test-guards.sh passes again, including the six whose fixture carries a .ts file"
      - "A probe fixture reaches a resolvable typescript and tests/kernel/kernel-source.ts, rather than the script being softened for a toolchain-less directory"
      - "The measurement probes still fail an oversized implementation and still exempt docs, tests, generated DDL and the guard harness"
  risk: low
  status: todo
  note: >
    ABSORBED BY gate-size-impl-exclude-comments, which now lists
    scripts/test-guards.sh in its produces and carries the fix. The history is
    kept here because the reasoning is the record: size-impl now classifies a
    .ts or .tsx line with the TypeScript compiler through
    tests/kernel/kernel-source.ts (ADR-035), so taking the measurement needs the
    typescript package and that reader. The budget probes in
    scripts/test-guards.sh built their fixtures as a copy of scripts/ in a temp
    directory with neither, so the six whose fixture carries a .ts file — the
    docs-heavy pair, the README case, the tests/ case, the test-guards.sh case
    and "the failure names the real implementation count" — refused, correctly,
    and the `guards` gate was red until the fix landed.

    The fix is the one ADR-031 already recorded for this same file: make the
    fixture the state a real run requires. Symlink the repository's
    node_modules into the fixture (and add it to the fixture .gitignore, so
    `git add -A` does not commit a symlink to an absolute path) and copy
    tests/kernel/kernel-source.ts in before the base commit. Do NOT relax the
    script for a directory missing its toolchain: under-counting is the
    direction size-impl exists to close, and a fixture that cannot measure is
    not a smaller version of a real run.

    tests/gates/size-impl-comments.test.ts already builds its gate fixtures
    exactly this way and its end-to-end cases pass, so the shape was proven; the
    fix is the same three lines applied to fixture_repo().
    No new gate and no new script (Ahmed, 2026-08-16). Every one of these is a
    judgement, and a script that could check it would be a script that could be
    argued with. Recorded as ADR-036 with the week's evidence.

    Four failures in one week, none of them a missing gate. module-deadlines-sweep
    was re-split three times because its shape was discovered while building.
    ALL GATES PASS was reported from a run made before the commit it described.
    A mutation result of 23 killed with zero survivors was scored against a red
    baseline and did not reproduce — an independent re-run found 13 survivors in
    30. And that same node took six passes across four gates without tripping the
    old three-strike rule, because the rule counted per gate.

    The comment limits carry the sharpest tension and it is recorded rather than
    smoothed over: they restrict explanation in a repository that has just spent
    ADR-035 establishing annotation is worth protecting. The reconciliation is
    that a 3-line pointer to an ADR beats a 20-line copy that drifts out of date.

    Note the reviewer's duty to fail a comment contradicting its code was NOT
    already on main when this landed — it lives on the unmerged
    gate-reviewer-context-authority branch. The minimal form is added here so the
    comment limits are enforceable; the fuller authority order is still unmerged.

- id: timezone-reject-utc
  title: A business calendar may not be configured in UTC
  phase: 1
  depends_on: [module-deadlines-civil-date]
  spec: docs/architecture/components-core-deadline-monitor.md
  also_read:
    - docs/architecture/data-model.md              # BusinessCalendar.timeZone
  produces:
    - lib/kernel/jurisdiction/{index,repository}.ts
    - tests/kernel/kernel-entities.test.ts
    - docs/architecture/components-core-deadline-monitor.md
    - docs/architecture/data-model.md
    - tasks/backlog.yaml
    - tests/baseline.json
  done_when:
    gates: [lint, types, boundaries, tests, coverage]
    assertions:
      - "isTimeZone rejects UTC for a business calendar, and the error names the jurisdiction's civil zone instead"
      - "The equivalent spellings of UTC are rejected too, not only the three letters"
      - "Every real civil zone the five jurisdictions use is still accepted"
      - "A zone Intl cannot resolve is still rejected, as before"
      - "Rejection happens on write, where the value enters, not later from Intl inside civilDateIn"
  risk: low
  status: todo
  note: >
    Ahmed, 2026-08-16. module-deadlines-civil-date made the timezone required
    with no default so that nobody could inherit UTC by accident. But isTimeZone
    accepts "UTC" because it IS a real IANA zone, so a calendar could still be
    configured in the exact value the column exists to stop being assumed —
    deliberately, and invisibly thereafter.

    The column's whole purpose is that a jurisdiction's CIVIL date decides what
    "today" means: the sweep fires at 02:00, which in the Gulf is 22:00 the
    previous UTC day, so a calendar reading UTC warns a day late for four hours
    of every day. That is the defect the field was added to prevent, and no
    jurisdiction OpsMind operates in keeps civil time in UTC.

    So the rejection is not "UTC is not a zone" — it is "UTC is not a CIVIL zone
    for a jurisdiction", and the error must say so by naming the zone that
    jurisdiction actually uses rather than only refusing. A refusal that does not
    tell the administrator what to type instead gets worked around.

    Reject the equivalent spellings too, or the rule is decoration: Etc/UTC,
    Etc/GMT, Etc/Zulu, GMT, Zulu and UCT all resolve to the same offset with no
    civil rules attached. Etc/GMT+N is a fixed offset rather than a civil zone
    and belongs in the same refusal.

- id: timezone-reject-offset-abbreviations
  title: Whether a business calendar may carry EET, CET or EST is unsettled
  phase: 1
  depends_on: [timezone-reject-utc]
  spec: docs/architecture/components-core-deadline-monitor.md
  done_when:
    gates: [lint, types, boundaries, tests, coverage]
    assertions:
      - "A jurisdiction's calendar carries that jurisdiction's own civil zone, so EET for Egypt is refused as the wrong country"
      - "The accepted zone is resolved from data, never from a hardcoded list of five"
      - "The rule the code enforces matches the rule the spec states"
  risk: low
  status: todo
  note: >
    SETTLED 2026-08-17, NOT BUILT — do not build it yet.

    THE RULE: a jurisdiction's calendar must carry THAT JURISDICTION'S OWN
    civil zone, resolved from DATA rather than from a hardcoded list. EET for
    Egypt is then refused as the wrong COUNTRY, not as the wrong kind of name.

    That is stronger than the problem which prompted it. Refusing on wrong
    country also catches Asia/Dubai on an Egyptian calendar — a real zone, a
    real place, and wrong by two hours — which no offset-name predicate would
    ever have found. Resolving from data rather than a literal set of five is
    what stops the sixth jurisdiction being a code change.

    timezone-reject-utc refuses UTC, its spellings and the Etc/GMT±N fixed
    offsets. It does NOT refuse EET, CET, MET, WET, EST, MST, HST or the
    EST5EDT family: those are bare offset-denoting names that link into
    GEOGRAPHIC zones rather than into Etc/, so they pass a predicate keyed on
    the Etc/ area. An earlier version of that node claimed IANA collects every
    placeless name under Etc/; it does not, and the claim has been corrected in
    the code comment and the spec rather than left standing.

    The hazard is demonstrated, not theoretical. Intl folds EET onto
    Europe/Athens, whose DST does not coincide with Egypt's, so an Egypt
    calendar typed EET reports a different civil date for the weeks the two
    disagree — 2026-04-10T21:30Z is the 10th in Africa/Cairo and the 11th in
    EET. Narrower than UTC's four hours a day, the same class of wrongness, and
    the same invisibility. EET is also the plausible mistake: it is what a
    European-trained administrator reaches for when asked for Egypt's zone.

    Three readings are open and only Ahmed can choose. Refuse every
    offset-denoting name, so the stated rule "the name denotes a place" holds
    literally. Or accept them as valid IANA input, and narrow the spec to say
    only UTC is refused. Or go narrower still and require a jurisdiction's
    calendar to carry that jurisdiction's own zone, so EET for Egypt is refused
    as the wrong country rather than the wrong kind of name.

- id: module-deadlines-repository
  title: The deadline monitor's Prisma store, landing with the tests that can reach it
  phase: 1
  depends_on: [module-deadlines-sweep, kernel-repository-integration-tests]
  spec: docs/architecture/data-ownership.md
  produces:
    - lib/modules/deadlines/{repository,index}.ts
    - tests/integration/modules/deadlines/
    - tests/modules/deadlines/repository.test.ts
  done_when:
    gates: [lint, types, boundaries, tests, coverage]
    assertions:
      - "repository.ts imports db from lib/db.ts and declares both tables with // owns:"
      - "Every exported member of prismaDeadlineStore is exercised against a real PostgreSQL"
      - "upsertRegistration is idempotent by (entityType, entityId, deadlineType) — a moved due date updates the row rather than creating a second identity"
      - "deregistering something already gone is not an error"
      - "listRegistrations returns the whole set, because absence from a complete report is what resolves an alert"
  risk: low
  status: todo
  note: >
    Carried out of module-deadlines-sweep on 2026-08-17, not written fresh. The
    code is already reviewed and its source-level assertion already passes; what
    it lacks is a test that executes it.

    WHY IT MOVED. Its four Prisma calls are not unit-coverable — no PostgreSQL is
    reachable outside CI — so inside the sweep they held diff-cov at 89.09%
    against the 90 floor, six lines short of a 55-line diff. The sweep neither
    caused that nor could fix it. Every other module's repository will hit this
    identically, so ADR-037 settles the pattern once: a module repository lands
    with its integration tests rather than with the module logic it serves.

    It depends on kernel-repository-integration-tests because that node builds
    the harness — a real database in CI, skipped loudly and never silently
    where none is reachable — and this node is its first module-side consumer.

    Two alternatives were refused when the sweep hit this, and are recorded here
    so they are not re-proposed. A diff-cov waiver: that gate deliberately has no
    waiver mechanism, and opening one to pass the node that needed it is how a
    gate stops meaning anything. And a CI-only integration test inside the sweep:
    green in CI and red locally is worse than either verdict alone, because a
    developer learns to ignore the local run.

- id: gate-total-cov-nondeterministic
  title: total-cov returns two verdicts for one commit
  phase: 0
  depends_on: [kernel-repository-integration-tests]
  spec: PIPELINE.md#the-gates
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "Two coverage runs on one unchanged commit produce the same verdict"
  risk: low
  status: todo
  note: >
    RECORDED, NOT INVESTIGATED. Observed 2026-08-17 at commit 1012315: total-cov
    reported FAIL, then PASS at 99.24% against a 99.24% baseline, on the same
    commit with a clean tree and no change between runs. A false red is the same
    class of defect as a false green (ADR-033) — both mean the verdict does not
    describe the subject. Suspected: the integration suite boots six in-process
    engines, and a coverage run that loses one file's instrumentation lands just
    under a ratchet set at the exact measured value.

- id: kernel-repository-integration-tests
  title: Integration tests over the six kernel repositories, against CI Postgres
  phase: 1
  depends_on: [gate-coverage-strict-path]
  spec: docs/architecture/data-ownership.md
  produces:
    - tests/integration/kernel/
    - tests/integration/support/database.ts
    - .github/workflows/gates.yml
    - vitest.config.ts
    - package.json
    - docs/architecture/decisions.md
    - tasks/backlog.yaml
    - tests/baseline.json
  done_when:
    gates: [lint, types, tests, coverage]
    assertions:
      - "Every exported function of the six kernel repositories is exercised against a real PostgreSQL"
      - "The suite never skips: it uses DATABASE_URL when present, otherwise boots an in-process engine"
      - "A test that cannot obtain an engine FAILS and names why — never a skip, never a pass"
      - "The same migrations run on both engines, so a divergence surfaces as a migration failure rather than a silent behaviour difference"
      - "A test passing locally and failing in CI, or the reverse, is reported as an engine-divergence finding — never retried, never called flakiness"
      - "Total repository coverage rises, and the new floor is recorded in tests/baseline.json"
  risk: low
  status: todo
  note: >
    RECORDED, NOT BUILT. Ahmed 2026-08-15: it merges before money-spine.

    lib/kernel/*/repository.ts sits between 0% and 15% — document, enrolment,
    jurisdiction, legal-entity, person, regime. Nothing else in the graph will
    raise them: they are Prisma plumbing, and no PostgreSQL is reachable outside
    CI, so unit tests structurally cannot reach the query bodies.

    gate-coverage-strict-path stops that blocking every compliance task, but it
    does not fix it — it measures the diff instead, and the total ratchet only
    holds the line where it is. These files stay near zero until something
    executes them, and they are what payroll and the money spine read through.
    Hence before money-spine, not after.

    ASSERTION 2 WAS AMENDED, AND THAT IS THE CONTRACT WORKING. As written this
    node required the suite to be "skipped, loudly, where none is reachable".
    That is the split-brain verdict ADR-037 refuses: a gate green in one place
    and red in the other teaches a developer to ignore the local run, which is
    the stale-baseline failure. The node predates that record. Under the
    reviewer contract a spec contradicting an ADR resolves FOR THE ADR and the
    spec is amended — so it was, rather than the ADR being quietly re-litigated
    by a node older than it (Ahmed, 2026-08-17).

    THE ENGINE CHOICE, which six kernel repositories and every module repository
    inherit. DATABASE_URL when present, otherwise an in-process PGlite over a
    socket so Prisma connects normally — no driver adapter, no preview feature,
    no schema change. Never a skip.

    CI keeps the engine production uses, deliberately. Migrations are the
    highest-risk thing these tests exercise and the likeliest place two engines
    diverge — constraint enforcement, NOT NULL backfills, the append-only
    trigger. PGlite everywhere would buy exactness where it matters least and
    give it up where it matters most. The harness runs the SAME migrations on
    both, so a divergence surfaces as a migration failure rather than as a
    silent behaviour difference.

    BUILT. ADR-038 records the engine rule and the three PGlite divergences it
    cost — a connection dropped on any error response, prepared-statement names
    colliding across the reconnect, and the per-database migrate advisory lock.
    Coverage went 84.59% to 99.24% total, all six repositories at 100% of lines.
    The DATABASE_URL path was demonstrated against a PGlite socket, not against
    postgres:16: no PostgreSQL is reachable from the machine that built it,
    which is the condition that made this node necessary. CI is its first real
    run, and .github/workflows/gates.yml needed no change to give it one.

- id: kernel-source-compiler-api
  title: Read kernel source with the TypeScript compiler API
  phase: 0
