    NOTHING HERE IS A CONSTANT. ADR-020 says tuning values wait for real
    traffic, so a cadence is a row and not a number in code, the same shape as
    ThresholdTable. A default cadence invented now is a compliance value nobody
    specified.

    OPEN: what a source with no configured cadence means. Never dark, so a
    misconfiguration buys silence; or immediately suspect, so every new source
