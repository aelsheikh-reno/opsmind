- id: gate-size-total-default
  title: Raise the whole-PR backstop to 1500
  phase: 0
  depends_on: [gate-size-generated-sql]
  spec: PIPELINE.md#the-gates
  produces:
    - scripts/gate.sh
    - scripts/test-guards.sh
    - docs/architecture/decisions.md
  done_when:
    gates: [lint, types, tests]
    assertions:
      - "size-total defaults to 1500"
      - "size-impl is still 400 and still cannot be raised by a node"
      - "A per-task size_total still raises or lowers only that task's total budget"
      - "A waiver without a reason, or with a non-numeric value, still fails closed"
  risk: low
  status: done
  note: >
    Five of fifteen substantive tasks had to waive an 800 backstop that was
    calibrated before documentation and generated DDL were excluded from
