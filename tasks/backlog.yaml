- id: service-alerts-source-dark-sweep
  title: Alert Manager — a silent source raises one alarm, and its alerts freeze
  phase: 1
  depends_on: [service-alerts-source-registry]
  spec: docs/architecture/flows-alerting.md
  also_read:
    - docs/architecture/operations-scheduling.md   # ADR-011, each owner runs its own timers
  produces:
    - lib/services/alerts/{index,liveness}.ts
    - tests/services/alerts/
    - docs/architecture/operations-scheduling.md
    - tests/baseline.json
  done_when:
    gates: [lint, types, boundaries, tests, coverage]
    assertions:
      - "A source that misses its expected report raises exactly one source-dark alert, never one per frozen alert"
      - "Every open alert of a dark source is marked STALE, and none of them is resolved"
      - "A source already dark does not raise a second alert on the next sweep"
      - "The source-dark alert resolves when that source reports a completed run again, and its frozen alerts stop being STALE"
      - "The sweep is idempotent: running it twice inside one window changes nothing the first run did not"
      - "The engine does not claim to watch itself: the external dead-man's check is stated where an operator reads it"
  risk: compliance
  status: todo
  note: >
    A dead watcher may flag alerts unconfirmed and may never close one. This is
    where that rule is executed rather than asserted — the engine acting as a
    source about its own inputs.

    Its own timer, with a sweep behind it, because time-based work belongs to
    the component whose domain it is and a level-based recheck is what makes a
    missed tick self-heal (ADR-011). The sweep is stateless in the same sense
    the deadline sweep is: it recomputes which sources are overdue from their
    configured cadence and remembers nothing.

    OPEN: at what severity a source-dark alert is raised, and what "escalated to
    engineering" means to an engine with no routing vocabulary and no permission
    to acquire one. The severity enum has two values and adding a third is a
    migration, deliberately; picking one of the two here is a judgement about
    urgency the spec never makes.

    The dead-man's note is carried, not solved: the engine cannot alert on its
    own death, and one external check on it is the only external monitoring
    dependency in the design.

    Roughly 180-240 implementation lines.
- id: service-alerts-acknowledge-suppress
  title: Alert Manager — acknowledgement pauses paging, suppression is bounded, both name an actor
  phase: 1
