    data-model.md says up front that it covers "the shapes that changed or are
    new in the target" and that unchanged tables are not repeated. That is
    coherent for a refactor of a live database, where those tables already
    exist. This is a greenfield build, so it means several modules have no
    specification at all — and the gap is only discovered when a task reaches
    the module and finds nothing to build to. module-deadlines hit it mid-PR:
    DeadlineRegistration and ThresholdTable were named in one cell of
    data-ownership.md and nowhere else.

    Report and stop. Writing shapes is the nodes below, so that inventing a data
    model is never something that happens inside an implementation PR under a
    size budget.

